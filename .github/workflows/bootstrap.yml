name: Install Household Ledger files
on:
  push:
    paths:
      - ".bootstrap/household-ledger.zip.b64"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/household-ledger.zip.b64 ]; then
            echo "Archive already installed."
            exit 0
          fi
          base64 -d .bootstrap/household-ledger.zip.b64 > /tmp/household-ledger.zip
          mkdir -p /tmp/household-ledger-source
          unzip -q /tmp/household-ledger.zip -d /tmp/household-ledger-source
          cp -a /tmp/household-ledger-source/household-ledger/. .
          rm -rf .bootstrap
      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install Household Ledger application source"
            git push origin HEAD:main
          fi
