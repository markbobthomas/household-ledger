name: Demo versus Real capability audit
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: planner-parity-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify same planner and forecast engine for Demo and Real
        run: |
          node --check planner.js
          node --check planner-backtest.js
          node tests/planner-parity.cjs
          node tests/planner-routine-smoke.cjs
          node tests/planner-backtest-smoke.cjs
