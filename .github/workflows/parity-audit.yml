name: Demo versus Real capability audit
# Manual deep check. The same parity assertion runs once in the required PR core suite.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Demo/Real forecast parity
        run: node tests/ci-suite.cjs parity
