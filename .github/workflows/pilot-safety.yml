name: Real-account pilot safety checks
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active bank and planner syntax
        run: |
          node --check pilot/server.cjs
          node --check pilot/transactional-store.cjs
          node --check pilot/data-source.js
          node --check planner-core.js
          node --check planner-history.js
          node --check planner-transactions.js
          node --check payment-obligations.js
          node --check planner.js
          node --check planner-summary.js
          node --check planner-coverage.js
          node --check account-forecast.js
          node --check accounting.js
          node --check ledger-data.js
          node --check reviews.js
          node --check categorization.js
          node --check sandbox/server.cjs
          node --check sandbox/sandbox-ui.js
          node --check tests/ci-suite.cjs
          node --check tests/architecture-baseline.cjs
          node --check tests/planner-legacy-invariants-smoke.cjs
          node --check tests/financial-interpretation-smoke.cjs
          node --check tests/transactional-storage-smoke.cjs
      - name: Verify private AI analysis redaction and advisory boundary
        run: |
          node --check pilot/ai-private-adapter.cjs
          node tests/ai-advisory-smoke.cjs
          node tests/ai-private-adapter-smoke.cjs
          node tests/ai-forecast-reconcile-smoke.cjs
          node --check pilot/ai-financial-report.cjs
          node --check pilot/ai-report-investigator.cjs
          node tests/ai-financial-report-smoke.cjs
          node --check pilot/ai-chat.cjs
          node tests/ai-financial-chat-smoke.cjs
          node --check pilot/ai-independent-tools.cjs
          node tests/ai-independent-analysis-smoke.cjs
          node --check pilot/ai-qaqc.cjs
          node tests/ai-qaqc-smoke.cjs
          node --check pilot/ai-report-cache.cjs
          node tests/ai-report-cache-smoke.cjs
          node --check pilot/ai-independent-forecast.cjs
          node tests/ai-independent-forecast-smoke.cjs
      - name: Verify frozen output, banking safety, parity and reconciliation once
        run: |
          node tests/architecture-baseline.cjs --capture
          node tests/ci-suite.cjs core
