name: Real-account pilot safety checks
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active bank and planner syntax
        run: |
          node --check pilot/server.cjs
          node --check pilot/data-source.js
          node --check planner-core.js
          node --check planner-transactions.js
          node --check payment-obligations.js
          node --check planner.js
          node --check planner-summary.js
          node --check planner-backtest.js
          node --check planner-coverage.js
          node --check account-forecast.js
          node --check planner-intelligence.js
          node --check accounting.js
          node --check ledger-data.js
          node --check reviews.js
          node --check categorization.js
          node --check sandbox/server.cjs
          node --check sandbox/sandbox-ui.js
          node --check tests/ci-suite.cjs
          node --check tests/architecture-baseline.cjs
      - name: Verify frozen output, banking safety, parity and reconciliation once
        run: node tests/ci-suite.cjs core
