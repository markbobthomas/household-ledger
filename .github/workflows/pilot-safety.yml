name: Real-account pilot safety checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check independent pilot server syntax
        run: |
          node --check pilot/server.cjs
          node --check pilot/data-source.js
          node --check payment-obligations.js
          node --check planner-intelligence.js
          node --check planner-backtest.js
          node --check planner-transactions.js
          node --check account-forecast.js
          node --check sandbox/server.cjs
      - name: Smoke test authentication, health and no-credentials startup
        run: |
          node tests/pilot-security-smoke.cjs
          node tests/pilot-plaid-flow.cjs
          node tests/pilot-remove-account-smoke.cjs
          node tests/recurrence-reconcile-smoke.cjs
          node tests/payment-obligations-smoke.cjs
          node tests/card-statement-cycles-smoke.cjs
          node tests/card-setup-gate-smoke.cjs
          node tests/planner-routine-smoke.cjs
          node tests/planner-backtest-smoke.cjs
          node tests/planner-transactions-smoke.cjs
          node tests/planner-series-smoke.cjs
          node tests/every-four-weeks-smoke.cjs
          node tests/planner-recurring-confirmation-smoke.cjs
          node tests/planner-opt-out-smoke.cjs
          node tests/planner-merchant-streams-smoke.cjs
          node tests/planner-core-smoke.cjs
          node tests/planner-alternating-pay-smoke.cjs
          node tests/planner-payroll-safety-smoke.cjs
          node tests/planner-missing-mortgage-smoke.cjs
          node tests/planner-history-smoke.cjs
          node tests/history-any-recurring-smoke.cjs
          node tests/planner-early-recurrence-smoke.cjs
          node tests/recurrence-early-dedupe-smoke.cjs
          node tests/planner-recurrence-integration-smoke.cjs
          node tests/forecast-only-save-smoke.cjs
          node tests/forecast-client-save-smoke.cjs
          node tests/planner-income-smoke.cjs
          node tests/mortgage-prediction-smoke.cjs
