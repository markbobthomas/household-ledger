name: Reconciliation accuracy gate
# Manual focused run. All six assertions are already required in the PR core suite.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconciliation and categorization invariants
        run: node tests/ci-suite.cjs reconciliation
