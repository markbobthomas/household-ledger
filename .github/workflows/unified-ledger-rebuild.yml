name: Unified Future Ledger rebuild validation
# Legacy rebuild branch validation; no longer duplicates hard-coded test lists.
on:
  push:
    branches: [rebuild/unified-future-ledger]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared frozen-core and historical recurrence checks
        run: |
          node tests/ci-suite.cjs core
          node tests/ci-suite.cjs historic
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Test desktop Chromium and iPhone WebKit
        run: node tests/ci-suite.cjs browser
