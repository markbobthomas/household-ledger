name: Publish Household Ledger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # Uploads may take a moment to become visible to the Pages deployment API.
      # Retrying the entire job can upload duplicate artifacts with the same name.
      - name: Allow Pages artifact discovery to settle
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
