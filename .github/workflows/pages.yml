name: Publish Household Ledger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub's artifact lookup can lag a successful upload. A rerun of the
      # same workflow creates duplicate 'github-pages' artifacts, so give the
      # initial upload time to become visible before deployment.
      - name: Wait for Pages artifact indexing
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
