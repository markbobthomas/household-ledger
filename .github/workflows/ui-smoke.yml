name: Browser interaction test
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: planner-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and iPhone WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify balance planner, bank data integrity and mobile layout
        run: |
          node --check planner.js
          node tests/planner-browser.cjs
          node tests/payment-obligations-smoke.cjs
          node tests/mortgage-prediction-smoke.cjs
