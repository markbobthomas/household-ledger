name: Browser interaction test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify interactive price bands in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/price-band-smoke.cjs
          node tests/category-budget-smoke.cjs
          node tests/inline-edit-smoke.cjs
          node tests/inline-category-smoke.cjs
          node tests/activity-recurring-smoke.cjs
          node tests/accounting-phaseA-smoke.cjs
          node tests/account-forecast-phaseB-smoke.cjs
          node tests/cashflow-smoke.cjs
          node tests/design-smoke.cjs
          node tests/settings-geometry-diagnostic.cjs
          node tests/mobile-safari-smoke.cjs
          node tests/recurring-smoke.cjs
          node tests/current-month-smoke.cjs
          node tests/ledger-readonly-smoke.cjs
          node tests/expected-spending-smoke.cjs
          node tests/prediction-phase1-smoke.cjs
          node tests/unified-forecast-smoke.cjs
          node tests/reviews-smoke.cjs
          node tests/reviews-count-tabs-smoke.cjs
          node tests/learning-phase3-smoke.cjs
          node tests/accuracy-phase4-smoke.cjs
          node tests/phase41-smoke.cjs
          node tests/phase42-smoke.cjs
          node tests/phase43-smoke.cjs
