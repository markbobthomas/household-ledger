name: Browser interaction test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: planner-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether the website needs browser checks
        id: changes
        shell: bash
        run: |
          run_browser=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            run_browser=true
          elif ! git rev-parse --verify -q 'HEAD^1' >/dev/null; then
            # Missing diff metadata must never silently suppress UI tests.
            run_browser=true
          else
            while IFS= read -r changed; do
              case "$changed" in
                index.html|modern.css|planner.css|demo-data.js|bank-feed.js|accounting.js|categorization.js|ledger-data.js|payment-obligations.js|planner*.js|pilot/data-source.js|tests/*browser.cjs|tests/planner-recurrence-integration-smoke.cjs|.github/workflows/ui-smoke.yml|tests/ci-suite.cjs)
                  run_browser=true ;;
              esac
            done < <(git diff --name-only 'HEAD^1' HEAD)
          fi
          echo "browser=$run_browser" >> "$GITHUB_OUTPUT"
          echo "Browser regression required: $run_browser"
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.browser == 'true'
        with:
          node-version: '22'
      - name: Install Chromium and iPhone WebKit
        if: steps.changes.outputs.browser == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify desktop Chromium and iPhone WebKit interactions
        if: steps.changes.outputs.browser == 'true'
        run: node tests/ci-suite.cjs browser
