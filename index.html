<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8faf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Household Ledger · Balance Planner</title>
<link rel="stylesheet" href="planner.css?v=footer-note-oct22">
</head>
<body>
<main class="shell"><div class="content">
  <header class="topbar">
    <div>
      <h1>Household Ledger</h1>
    </div>
    <div class="top-actions">
      <details class="planner-menu" id="planner-menu"><summary aria-label="Open other planning tools">☰ <span>More</span></summary>
        <div class="planner-menu-content" role="group" aria-label="Other planning tools">
          <button type="button" data-view="transactions">All Predictions</button>
          <button type="button" data-view="settings">Settings</button>
          <a href="/bank-connect">Bank connections</a>
          <small id="deployment-version">Version not verified</small>
        </div>
      </details>
      <span class="status-tag" id="source-type" aria-live="polite">DEMO DATA</span>
      <select id="ledger-mode-switch" class="mode-box" aria-label="Bank data source"><option value="demo">Demo</option><option value="real">Real / Plaid</option></select>
      <button class="btn primary" type="button" id="audit-launch" data-run-backtest hidden>Check accuracy</button>
      <button class="btn" type="button" id="refresh-bank" hidden>Refresh bank</button>
      <a class="btn" id="bank-connect" href="/bank-connect" hidden>Bank connections</a>
    </div>
  </header>
  <nav class="planner-tabs planner-nav-primary" aria-label="Main planner navigation">
    <button type="button" class="tab-link active" data-view="summary" aria-current="page">Calendar</button>
     <button type="button" class="tab-link" data-view="schedules">Schedules</button>
    <button type="button" class="tab-link" data-view="history">History</button>
    <button type="button" class="tab-link" data-view="reviews">Needs Review</button>
  </nav>
  <div id="planner-notice" aria-live="polite"></div>
  <div id="planner-main" aria-live="polite"><div class="panel">Preparing your balance plan…</div></div>
  <footer id="planner-fine-print" class="planner-fine-print" hidden></footer>
  </div></main>
<script src="demo-data.js"></script>
<script src="bank-feed.js"></script>
<script src="accounting.js?v=income1"></script>
<script src="categorization.js"></script>
<script src="ledger-data.js?v=cardsetup1"></script>
<script src="payment-obligations.js?v=three-year1"></script>
<script src="planner-transactions.js?v=quickfind1"></script>
<script src="planner-history.js?v=altpay1"></script>
<script src="planner-core.js?v=quickfind1"></script>
<script src="planner-coverage.js?v=category-learning1"></script>
<script src="planner-summary.js?v=calendar-recovery1"></script>
<script src="planner.js?v=footer-note-oct22"></script>
<noscript>JavaScript is required to display account balances and planning projections.</noscript>
</body>
</html>
