<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#111418"><title>Household Ledger</title><link rel="stylesheet" href="modern.css"></head><body><aside aria-label="Primary navigation"><h2><span class="brand-mark">HL</span><span class="brand-word"> / LEDGER</span></h2><button class="active" data-page="budgets"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Budget</span></button><button data-page="transactions"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 6h14M7 12h14M7 18h14"/><circle cx="3.5" cy="6" r=".8" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r=".8" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r=".8" fill="currentColor" stroke="none"/></svg><span>Activity</span></button><button data-page="insights"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20V11m6 9V4m6 16v-7m4 7V8" stroke-linecap="round"/></svg><span>Insights</span></button><button data-page="settings"><svg class="nav-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="#111418"/><circle cx="15" cy="17" r="2.5" fill="#111418"/></svg><span>Settings</span></button></aside><main><div class="content"><div class="page-top"><h1 id="title">Budgets</h1> (()=>{
'use strict';const KEY='household-ledger-v1',CATS=['Groceries','Shopping','Housing','Utilities','Transportation','Dining','Health','Entertainment','Kids & Family','Insurance','Subscriptions','Other'],BANDS=[['Under $10',0,10],['$10–$25',10,25],['$25–$50',25,50],['$50–$100',50,100],['$100–$200',100,200],['$200–$500',200,500],['$500+',500,Infinity]],money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c])),el=x=>document.getElementById(x),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('en-CA');const initialStorage=localStorage.getItem(KEY);let data;try{data=JSON.parse(initialStorage);if(!data||!Array.isArray(data.transactions))throw Error()}catch{data={transactions:[],items:[],budgets:{}}}data.items??=[];data.budgets??={};if(initialStorage===null&&typeof window.createHouseholdLedgerDemo==='function'){data=window.createHouseholdLedgerDemo();save()}function hasDemo(){return data.transactions.some(t=>t.demo)}function loadDemo(){if(typeof window.createHouseholdLedgerDemo!=='function'){alertMsg('Demo data file could not be loaded.');return}const demo=window.createHouseholdLedgerDemo(),existing=new Set(data.transactions.map(t=>t.id)),fresh=demo.transactions.filter(t=>!existing.has(t.id));data.transactions.push(...fresh);const itemIds=new Set(data.items.map(x=>x.id));data.items.push(...demo.items.filter(x=>!itemIds.has(x.id)));for(const [key,value] of Object.entries(demo.budgets))if(!(key in data.budgets))data.budgets[key]=value;save();render();alertMsg('Fictional sample data added.')}function removeDemo(){const n=data.transactions.filter(x=>x.demo).length;if(!n)return;if(!confirm('Remove '+n+' fictional sample transactions and their linked items? Your own transactions will remain.'))return;const demoIds=new Set(data.transactions.filter(x=>x.demo).map(x=>x.id));data.transactions=data.transactions.filter(x=>!x.demo);data.items=data.items.filter(x=>!x.demo&&!demoIds.has(x.transactionId));save();render();alertMsg('Sample transactions removed.')}let page='budgets',period=today().slice(0,7),budgetMonth=today().slice(0,7),insightMode='categories';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function alertMsg(s){el('flash').innerHTML='<div class="message">'+esc(s)+'</div>';setTimeout(()=>el('flash').innerHTML='',5000)}function cleanMerchant(s){let u=s.toUpperCase();if(u.includes('COSTCO'))return /GAS|FUEL|PUMP/.test(u)?'Costco Gas':'Costco Warehouse';if(/AMAZON|AMZN/.test(u))return 'Amazon';if(u.includes('WALMART')||u.includes('WAL-MART'))return 'Walmart';if(u.includes('SAFEWAY'))return 'Safeway';return s.trim()}function type(s,n){if(/TRANSFER|PAYMENT TO|CARD PAYMENT|AUTOPAY|CREDIT CARD PAYMENT/i.test(s))return 'transfer';if(/PAYROLL|DIRECT DEPOSIT|REFUND|DEPOSIT/i.test(s))return 'income';return n>0?'income':'expense'}function category(s){s=s.toLowerCase();if(/costco gas|shell|chevron|fuel|exxon/.test(s))return'Transportation';if(/costco|safeway|grocery|trader joe|kroger/.test(s))return'Groceries';if(/amazon|walmart|target|ebay|home depot/.test(s))return'Shopping';if(/mortgage|rent/.test(s))return'Housing';if(/water|electric|internet|utility|xfinity|verizon/.test(s))return'Utilities';if(/restaurant|coffee|pizza|cafe/.test(s))return'Dining';return'Other'}function rows(){return data.transactions.filter(t=>period==='all'||t.date.slice(0,7)===period)}function expense(){return rows().filter(t=>t.type==='expense')}function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}function grouped(a,field){const o={};a.forEach(t=>{const k=field==='merchant'?cleanMerchant(t.merchant):t.category;o[k]??={name:k,amount:0,count:0};o[k].amount+=+t.amount;o[k].count++});return Object.values(o).sort((a,b)=>b.amount-a.amount)}function recurringInsights(tabs){
  const model=window.HouseholdRecurring;
  if(!model)return tabs+'<div class="panel">Recurring analysis is unavailable.</div>';
  // Detect from all local history; the Insights month filter only limits displayed source transactions.
  const report=model.analyze(data.transactions,today());
  const currentOnly=period!=='all';
  function listRecurring(items,needsReview=false){
    if(!items.length)return'<div class="recurring-empty">'+(needsReview?'No subscriptions currently need review.':'No repeating payments detected yet.')+'</div>';
    return items.map(g=>{
      const visible=g.transactions.filter(t=>!currentOnly||t.date.startsWith(period)).slice().sort((x,y)=>y.date.localeCompare(x.date));
      const next=g.nextExpected?cashDateLabel(g.nextExpected,true):null;
      const amount=needsReview?money(g.amount)+' last charge':money(g.monthlyEstimate)+' / mo';
      const meta=needsReview?'Unconfirmed • '+g.count+' recorded charge'+(g.count===1?'':'s'):
        g.cadence+' • '+money(g.amount)+' per charge'+(next?' • Next est. '+next:'');
      return'<details class="drill-detail recurring-detail"><summary class="row drill-summary"><div class="recurring-info"><strong>'+esc(g.merchant)+'</strong><div class="recurring-meta">'+esc(meta)+'</div></div><div class="recurring-amount"><strong>'+amount+'</strong><div class="recurring-meta">'+(needsReview?esc(g.status):'Estimated monthly cost')+'</div></div><span class="chevron" aria-hidden="true">⌄</span></summary><div class="drill-expanded"><div class="recurring-detail-note">'+(needsReview?'One or more charges were found, but there is not enough consistent, recent history to estimate a schedule.':'Detected from '+g.count+' similar charges; expected dates and amounts are estimates, not confirmed bills.')+(currentOnly?' Showing source transactions for '+esc(period)+'.':'')+'</div>'+
      (visible.length?table(visible):'<div class="empty">No charges in the selected month. Select All dates to see the full history.</div>')+
      '</div></details>';
    }).join('');
  }
  return tabs+'<div class="stats recurring-stats">'+
    [['Subscriptions / month',report.subscriptionMonthly,report.subscriptions.length+' detected'],['Recurring bills / month',report.billsMonthly,report.bills.length+' detected'],['Combined / month',report.monthlyTotal,report.confirmed.length+' repeating expenses']].map(([label,value,meta])=>'<div class="stat"><div class="sub">'+label+'</div><div class="num">'+money(value)+'</div><div class="sub">'+meta+'</div></div>').join('')+
    '</div>'+
    '<div class="panel recurring-panel"><div class="section-top"><h3>Subscriptions</h3><span class="budget-summary-meta">'+report.subscriptions.length+' detected</span></div>'+listRecurring(report.subscriptions)+'</div>'+
    '<div class="panel recurring-panel"><div class="section-top"><h3>Recurring bills</h3><span class="budget-summary-meta">'+report.bills.length+' detected</span></div>'+listRecurring(report.bills)+'</div>'+
    (report.review.length?'<div class="panel recurring-panel"><div class="section-top"><h3>Subscriptions to review</h3><span class="budget-summary-meta">'+report.review.length+' uncertain</span></div>'+listRecurring(report.review,true)+'</div>':'')+
    '<div class="recurring-disclaimer">Estimates from local history; not bank-verified. One-off charges are excluded.</div>';
}
function gridStats(){const a=expense(),income=sum(rows().filter(x=>x.type==='income'));return'<div class="stats">'+[['Spent',money(sum(a))],['Income',money(income)],['Net cash flow',money(income-sum(a))]].map(x=>'<div class="stat"><div class="sub">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join('')+'</div>'}function list(a,max=999,kind=null,source=expense()){const top=Math.max(1,...a.map(x=>x.amount));return a.slice(0,max).map(x=>{const matching=kind?source.filter(t=>kind==='merchant'?cleanMerchant(t.merchant)===x.name:t.category===x.name).sort((a,b)=>b.date.localeCompare(a.date)):[];const line='<div style="flex:1;min-width:0"><b>'+esc(x.name)+'</b><div class="bar"><i style="width:'+(x.amount/top*100).toFixed(1)+'%"></i></div></div><div style="text-align:right"><strong>'+money(x.amount)+'</strong><div class="sub">'+x.count+' purchases</div></div>';if(!kind)return'<div class="row">'+line+'</div>';return'<details class="drill-detail"><summary class="row drill-summary">'+line+'<span class="chevron" aria-hidden="true">⌄</span></summary><div class="drill-expanded"><div class="sub">'+matching.length+' transactions • '+money(x.amount)+' total</div>'+table(matching)+'</div></details>'}).join('')||'<div class="empty">No data yet. Import a bank CSV or add a transaction.</div>'}function table(a){return'<div class="ledger-table-wrap"><table class="ledger-table"><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>'+a.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.merchant)+'</td><td>'+esc(t.category)+'</td><td>'+esc(t.type)+'</td><td><strong>'+money(t.amount)+'</strong></td><td><button class="btn" data-edit="'+esc(t.id)+'">Edit</button></td></tr>').join('')+'</tbody></table></div>'}function cashDateLabel(iso,year=false){return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',...(year?{year:'numeric'}:{})})}
function cashChart(series,lowestDate){
  const w=960,h=248,l=98,r=28,t=24,b=42,values=series.map(p=>p.balance);
  let min=Math.min(...values),max=Math.max(...values),pad=Math.max(250,(max-min)*.12);min-=pad;max+=pad;
  const x=i=>l+i/Math.max(1,series.length-1)*(w-l-r);
  const y=n=>t+(max-n)/(max-min)*(h-t-b);
  const pts=series.map((p,i)=>x(i).toFixed(1)+','+y(p.balance).toFixed(1)).join(' ');
  const lowIndex=series.findIndex(p=>p.date===lowestDate),low=series[lowIndex],grid=[0,.25,.5,.75,1].map(frac=>{const val=max-frac*(max-min),py=y(val);return '<line x1="'+l+'" y1="'+py.toFixed(1)+'" x2="'+(w-r)+'" y2="'+py.toFixed(1)+'" stroke="#e0e9ed" stroke-dasharray="4 5"/><text x="'+(l-9)+'" y="'+(py+4).toFixed(1)+'" font-size="17" fill="#54616e" text-anchor="end">'+esc(money(val))+'</text>'}).join('');
  const labels=[0,30,60,90].map(i=>{if(i>=series.length)return'';return '<text x="'+x(i).toFixed(1)+'" y="'+(h-9)+'" fill="#54616e" text-anchor="middle" font-size="18">'+esc(cashDateLabel(series[i].date))+'</text>'}).join('');
  const zero=min<0&&max>0?'<line x1="'+l+'" y1="'+y(0)+'" x2="'+(w-r)+'" y2="'+y(0)+'" stroke="#c75a55" stroke-dasharray="6 4"/>':'';
  return '<svg class="cash-chart" role="img" aria-label="Daily forecast of bank balance for 90 days. Lowest '+esc(money(low.balance))+' on '+esc(cashDateLabel(low.date,true))+ '." viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+grid+zero+'<polyline points="'+pts+'" fill="none" stroke="#526d63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+x(lowIndex).toFixed(1)+'" cy="'+y(low.balance).toFixed(1)+'" r="6" fill="#b48c56" stroke="#fff" stroke-width="2"/><circle cx="'+x(0)+'" cy="'+y(series[0].balance).toFixed(1)+'" r="4" fill="#526d63"/>'+labels+'</svg>';
}
function cashFlowCard(){
  const bank=window.HouseholdBankFeed,engine=window.HouseholdCashFlow;
  if(!bank||!engine)return'<div class="cash-panel cash-error">Bank forecasting is temporarily unavailable.</div>';
  const snapshot=bank.getSnapshot(today()),account=snapshot.accounts[0];
  if(!account)return'<div class="cash-panel cash-error">No bank account snapshots are available.</div>';
  // Demo bank amounts and transactions are exclusively fictional; never blend with private browser transactions.
  const transactions=snapshot.mode==='demo'&&window.createHouseholdLedgerDemo?window.createHouseholdLedgerDemo().transactions:data.transactions;
  const f=engine.cashFlow90({account,asOf:snapshot.asOf,days:90,transactions,source:snapshot.source});
  const metric=(name,value,meta,extra)=>'<div class="cash-metric '+(extra||'')+'"><div class="sub">'+esc(name)+'</div><div class="num">'+esc(money(value))+'</div><div class="sub">'+esc(meta)+'</div></div>';
  const days=f.series.slice(1);
  const rows=days.map(p=>'<tr><td><details class="cash-day-detail"><summary>'+esc(cashDateLabel(p.date,true))+'</summary><div class="cash-events">'+p.events.map(e=>'<div class="cash-event">'+esc(e.merchant)+' — '+esc(e.description)+': '+esc(money(e.amount))+'</div>').join('')+'</div></details></td><td>'+money(p.income)+'</td><td>'+money(p.outflow)+'</td><td><strong>'+money(p.balance)+'</strong></td></tr>').join('');
  const recurring=f.streams.map(v=>'<tr><td>'+esc(v.merchant)+'</td><td>'+esc(v.type)+'</td><td>Day '+v.day+'</td><td>'+money(v.amount)+'</td></tr>').join('');
  return'<div class="cash-panel" id="cashflow"><div class="cash-head"><div><h3>Lowest projected balance · next 90 days</h3><div class="cash-sub">'+esc(account.name)+' · '+esc(f.balanceBasis)+' balance</div></div><span class="cash-demo">SIMULATED BANK DATA</span></div>'+
  '<div class="cash-hero"><div><div class="cash-primary-amount">'+money(f.minimum)+'</div><div class="cash-primary-date">Lowest on '+esc(cashDateLabel(f.lowestDate,true))+'</div></div>'+
  '<div class="cash-secondary"><div><span class="sub">Available now</span><strong>'+money(f.opening)+'</strong></div><div><span class="sub">In 90 days</span><strong>'+money(f.closing)+'</strong></div></div></div>'+
  cashChart(f.series,f.lowestDate)+
  '<div class="cash-status">Estimated from '+esc(f.historyMonths.length)+' months of sample activity. Future bills and deposits may differ.</div>'+
  '<details class="cash-detail"><summary>Explore 90-day cash flow</summary><div class="cash-table-wrap"><table class="cash-table"><thead><tr><th>Date / expected items</th><th>Income</th><th>Outflow</th><th>End-of-day balance</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<details class="cash-detail"><summary>Prediction assumptions</summary><p class="sub">'+esc(f.method)+'. Historical months: '+(f.historyMonths.length?esc(f.historyMonths.join(', ')):'none')+'. Estimated everyday spending: '+money(f.dailyVariable)+'/day.</p>'+
  '<div class="cash-table-wrap"><table class="cash-table"><thead><tr><th>Expected item</th><th>Type</th><th>Estimated day</th><th>Amount</th></tr></thead><tbody>'+recurring+'</tbody></table></div>'+
  '<p class="cash-explain">Fictional bank balance and transactions only. No Plaid connection yet. These are estimated end-of-day balances, not an overdraft guarantee.</p></details></details></div>';
}
function budgetBounds(month){const [year,monthNum]=month.split('-').map(Number),endDay=new Date(year,monthNum,0).getDate(),start=month+'-01',end=month+'-'+String(endDay).padStart(2,'0');const label=new Date(year,monthNum-1,1).toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+new Date(year,monthNum-1,endDay).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});return {start,end,label}}function render(){const demoCount=data.transactions.filter(t=>t.demo).length;el('demo-banner').innerHTML=demoCount?'<div class="demo-banner"><strong>DEMO</strong></div>':'';const title=page.charAt(0).toUpperCase()+page.slice(1);el('title').textContent=title;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let months=[...new Set([...data.transactions.map(t=>String(t.date).slice(0,7)),today().slice(0,7),...(period==='all'?[]:[period])].filter(m=>/^\d{4}-\d{2}$/.test(m)&&+m.slice(5,7)>=1&&+m.slice(5,7)<=12))].sort().reverse();
if(page==='budgets'){
  const now=new Date(),recent=Array.from({length:12},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-i,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')});
  const choices=[...new Set([...months,...recent,budgetMonth])].sort().reverse();

  el('period').setAttribute('aria-label','Budget month');

}else{
  el('period').innerHTML='<option value="all" '+(period==='all'?'selected':'')+'>All dates</option>'+months.map(m=>'<option value="'+m+'" '+(period===m?'selected':'')+'>'+new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</option>').join('');
  el('period').setAttribute('aria-label','Transaction date filter');
  el('budget-range').hidden=true;
  el('subtitle').textContent=page==='transactions'?'All of your entries in one place.':page==='insights'?'See where your money actually goes.':'Data and account preferences.';
}
let a=expense(),html='';if(page==='transactions')html='<div class="panel"><div class="section-top"><h3>Transactions</h3><span class="budget-summary-meta">'+rows().length+' entries</span></div>'+table(rows().sort((a,b)=>b.date.localeCompare(a.date)))+'</div>';
if(page==='insights'){
  const tabs='<div class="insight-tabs" role="tablist" aria-label="Insight views">'+[['categories','Categories'],['merchants','Merchants'],['bands','Purchase sizes'],['recurring','Subscriptions / Recurring']].map(([key,name])=>'<button type="button" role="tab" aria-selected="'+(insightMode===key)+'" class="'+(insightMode===key?'active':'')+'" data-insight="'+key+'">'+name+'</button>').join('')+'</div>';
  if(insightMode==='categories'){
    html=tabs+gridStats()+'<div class="panel"><div class="section-top"><h3>Spending by category</h3></div>'+list(grouped(a,'category'),999,'category',a)+'</div>';
  }else if(insightMode==='merchants'){
    html=tabs+gridStats()+'<div class="panel"><div class="section-top"><h3>Merchant totals</h3></div>'+list(grouped(a,'merchant'),999,'merchant',a)+'</div>';
  }else if(insightMode==='recurring'){
    html=recurringInsights(tabs);
  }else{
    const purchases=a.flatMap(t=>{const linked=data.items.filter(i=>i.transactionId===t.id),parts=linked.length?linked:[t];return parts.map(i=>({transactionId:t.id,date:t.date,merchant:cleanMerchant(t.merchant),category:t.category,description:linked.length?String(i.description||i.name||i.title||'Itemized purchase'):'Entire transaction (not itemized)',amount:Number(i.amount),transactionTotal:Number(t.amount),itemized:linked.length>0}))}).filter(i=>Number.isFinite(i.amount));
    const counts=BANDS.map(([name,min,max],index)=>({name,min,max,index,count:0,amount:0,details:[]}));
    purchases.forEach(p=>{const band=counts.find(x=>p.amount>=x.min&&p.amount<x.max);if(band){band.count++;band.amount+=p.amount;band.details.push(p)}});
    html=tabs+gridStats()+'<div class="panel"><div class="section-top"><h3>Individual purchase price bands</h3><span class="budget-summary-meta">Item-level where available</span></div>'+
    counts.map(b=>{
      const d=b.details.slice().sort((x,y)=>y.date.localeCompare(x.date)||x.merchant.localeCompare(y.merchant));

      (d.length?'<div style="overflow:auto"><table class="details-table"><thead><tr><th>Date</th><th>Merchant</th><th>Purchase / item</th><th>Category</th><th>Purchase price</th><th>Transaction total</th><th></th></tr></thead><tbody>'+
      d.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.merchant)+'</td><td>'+esc(p.description)+(p.itemized?' <span class="pill">Itemized</span>':'')+'</td><td>'+esc(p.category)+'</td><td><strong>'+money(p.amount)+'</strong></td><td>'+money(p.transactionTotal)+'</td><td><button type="button" class="btn" data-edit="'+esc(p.transactionId)+'">View / edit</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No purchases in this price band.</div>')+'</div></details>'}).join('')+
    '<p class="budget-date-note">Full transactions are counted once when no item-level details are available.</p></div>';
