transactions=data.transactions.filter(x=>!x.demo);data.items=data.items.filter(x=>!x.demo&&!demoIds.has(x.transactionId));save();render();alertMsg('Sample transactions removed.')}let page='overview',period='all';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function alertMsg(s){el('flash').innerHTML='<div class="message">'+esc(s)+'</div>';setTimeout(()=>el('flash').innerHTML='',5000)}function cleanMerchant(s){let u=s.toUpperCase();if(u.includes('COSTCO'))return /GAS|FUEL|PUMP/.test(u)?'Costco Gas':'Costco Warehouse';if(/AMAZON|AMZN/.test(u))return 'Amazon';if(u.includes('WALMART')||u.includes('WAL-MART'))return 'Walmart';if(u.includes('SAFEWAY'))return 'Safeway';return s.trim()}function type(s,n){if(/TRANSFER|PAYMENT TO|CARD PAYMENT|AUTOPAY|CREDIT CARD PAYMENT/i.test(s))return 'transfer';if(/PAYROLL|DIRECT DEPOSIT|REFUND|DEPOSIT/i.test(s))return 'income';return n>0?'income':'expense'}function category(s){s=s.toLowerCase();if(/costco gas|shell|chevron|fuel|exxon/.test(s))return'Transportation';if(/costco|safeway|grocery|trader joe|kroger/.test(s))return'Groceries';if(/amazon|walmart|target|ebay|home depot/.test(s))return'Shopping';if(/mortgage|rent/.test(s))return'Housing';if(/water|electric|internet|utility|xfinity|verizon/.test(s))return'Utilities';if(/restaurant|coffee|pizza|cafe/.test(s))return'Dining';return'Other'}function rows(){return data.transactions.filter(t=>period==='all'||t.date.slice(0,7)===period)}function expense(){return rows().filter(t=>t.type==='expense')}function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}function grouped(a,field){const o={};a.forEach(t=>{const k=field==='merchant'?cleanMerchant(t.merchant):t.category;o[k]??={name:k,amount:0,count:0};o[k].amount+=+t.amount;o[k].count++});return Object.values(o).sort((a,b)=>b.amount-a.amount)}function gridStats(){let a=expense(),income=sum(rows().filter(x=>x.type==='income'));let count=a.reduce((n,t)=>n+(data.items.filter(i=>i.transactionId===t.id).length||1),0);return tional transactions</strong><span>Not real household spending.</span><button id="remove-demo-banner">Remove demo data</button></div>':'';if(demoCount)el('remove-demo-banner').onclick=removeDemo;const title=page.charAt(0).toUpperCase()+page.slice(1);el('title').textContent=title;el('section').textContent=title;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let months=[...new Set(data.transactions.map(t=>t.date.slice(0,7)))].sort().reverse();if(period!=='all'&&!months.includes(period))period='all';el('period').innerHTML='<option value="all">All dates</option>'+months.map(m=>'<option value="'+m+'" '+(period===m?'selected':'')+'>'+m+'</option>').join('');let a=expense(),html='';if(page==='overview')html=gridStats()+'<div class="grid"><div class="panel"><h3>Spending by category</h3>'+list(grouped(a,'category'),8,'category',a)+'</div><div class="panel"><h3>Top merchants</h3>'+list(grouped(a,'merchant'),8,'merchant',a)+'</div></div><div class="panel"><h3>Recent transactions</h3>'+table(rows().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12))+'</div>';if(page==='transactions')html='<div class="panel"><h3>Transactions · '+rows().length+' entries</h3>'+table(rows().sort((a,b)=>b.date.localeCompare(a.date)))+'</div>';if(page==='merchants')html=gridStats()+'<div class="panel"><h3>Merchant totals</h3>'+list(grouped(a,'merchant'),999,'merchant',a)+'</div>';if(page==='insights'){

d.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.merchant)+'</td><td>'+esc(p.description)+(p.itemized?' <span class="pill">Itemized</span>':'')+'</td><td>'+esc(p.category)+'</td><td><strong>'+money(p.amount)+'</strong></td><td>'+money(p.transactionTotal)+'</td><td><button type="button" class="btn" data-edit="'+esc(p.transactionId)+'">View / edit</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No purchases in this band for the selected dates.</div>')+'</div></details>'}).join('')+
'</div><div class="panel"><h3>Category breakdown</h3>'+list(grouped(a,'category'),999,'category',a)+'</div></div><p class="sub">Individual item prices are counted where itemization exists; otherwise, the entire transaction counts as one purchase. Totals do not double-count parent transactions.</p>';
}if(page==='budgets'){

cats.map(c=>{
