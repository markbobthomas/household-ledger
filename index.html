(()=>{
'use strict';const KEY='household-ledger-v1',CATS=['Groceries','Shopping','Housing','Utilities','Transportation','Dining','Health','Entertainment','Kids & Family','Insurance','Subscriptions','Other'],BANDS=[['Under $10',0,10],['$10–$25',10,25],['$25–$50',25,50],['$50–$100',50,100],['$100–$200',100,200],['$200–$500',200,500],['$500+',500,Infinity]],money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c])),el=x=>document.getElementById(x),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('en-CA');const Model=window.HouseholdLedgerData,initialStorage=localStorage.getItem(KEY);let initial;try{initial=initialStorage?JSON.parse(initialStorage):null}catch{initial=null}

function cleanMerchant(s){let u=s.toUpperCase();if(u.includes('COSTCO'))return /GAS|FUEL|PUMP/.test(u)?'Costco Gas':'Costco Warehouse';if(/AMAZON|AMZN/.test(u))return 'Amazon';if(u.includes('WALMART')||u.includes('WAL-MART'))return 'Walmart';if(u.includes('SAFEWAY'))return 'Safeway';return s.trim()}function type(s,n){if(/TRANSFER|PAYMENT TO|CARD PAYMENT|AUTOPAY|CREDIT CARD PAYMENT/i.test(s))return 'transfer';if(/PAYROLL|DIRECT DEPOSIT|REFUND|DEPOSIT/i.test(s))return 'income';return n>0?'income':'expense'}function category(s){s=s.toLowerCase();if(/costco gas|shell|chevron|fuel|exxon/.test(s))return'Transportation';if(/costco|safeway|grocery|trader joe|kroger/.test(s))return'Groceries';if(/amazon|walmart|target|ebay|home depot/.test(s))return'Shopping';if(/mortgage|rent/.test(s))return'Housing';if(/water|electric|internet|utility|xfinity|verizon/.test(s))return'Utilities';if(/restaurant|coffee|pizza|cafe/.test(s))return'Dining';return'Other'}function rows(){return entries().filter(t=>period==='all'||t.date.slice(0,7)===period)}function expense(){return rows().filter(t=>t.type==='expense')}function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}function grouped(a,field){const o={};a.forEach(t=>{const k=field==='merchant'?cleanMerchant(t.merchant):t.category;o[k]??={name:k,amount:0,count:0};o[k].amount+=+t.amount;o[k].count++});return Object.values(o).sort((a,b)=>b.amount-a.amount)}function recurringInsights(tabs){
  const model=window.HouseholdRecurring;
  if(!model)return tabs+'<div class="panel">Recurring analysis is unavailable.</div>';
  // Detect from all local history; the Insights month filter only limits displayed source transactions.
  const report=model.analyze(entries(),today());
  const currentOnly=period!=='all';
  function listRecurring(items,needsReview=false){
    if(!items.length)return'<div class="recurring-empty">'+(needsReview?'No subscriptions currently need review.':'No repeating payments detected yet.')+'</div>';
    return items.map(g=>{
      const visible=g.transactions.filter(t=>!currentOnly||t.date.startsWith(period)).slice().sort((x,y)=>y.date.localeCompare(x.date));
      const next=g.nextExpected?cashDateLabel(g.nextExpected,true):null;
      const amount=needsReview?money(g.amount)+' last charge':money(g.monthlyEstimate)+' / mo';
      const meta=needsReview?'Unconfirmed • '+g.count+' recorded charge'+(g.count===1?'':'s'):
        g.cadence+' • '+money(g.amount)+' per charge'+(next?' • Next est. '+next:'');
      return'<details class="drill-detail recurring-detail"><summary class="row drill-summary"><div class="recurring-info"><strong>'+esc(g.merchant)+'</strong><div class="recurring-meta">'+esc(meta)+'</div></div><div class="recurring-amount"><strong>'+amount+'</strong><div class="recurring-meta">'+(needsReview?esc(g.status):'Estimated monthly cost')+'</div></div><span class="chevron" aria-hidden="true">⌄</span></summary><div class="drill-expanded"><div class="recurring-detail-note">'+(needsReview?'One or more charges were found, but there is not enough consistent, recent history to estimate a schedule.':'Detected from '+g.count+' similar charges; expected dates and amounts are estimates, not confirmed bills.')+(currentOnly?' Showing source transactions for '+esc(period)+'.':'')+'</div>'+
      (visible.length?table(visible):'<div class="empty">No charges in the selected month. Select All dates to see the full history.</div>')+
      '</div></details>';
    }).join('');
  }
  return tabs+'<div class="stats recurring-stats">'+
    [['Subscriptions / month',report.subscriptionMonthly,report.subscriptions.length+' detected'],['Recurring bills / month',report.billsMonthly,report.bills.length+' detected'],['Combined / month',report.monthlyTotal,report.confirmed.length+' repeating expenses']].map(([label,value,meta])=>'<div class="stat"><div class="sub">'+label+'</div><div class="num">'+money(value)+'</div><div class="sub">'+meta+'</div></div>').join('')+
    '</div>'+
    '<div class="panel recurring-panel"><div class="section-top"><h3>Subscriptions</h3><span class="budget-summary-meta">'+report.subscriptions.length+' detected</span></div>'+listRecurring(report.subscriptions)+'</div>'+
    '<div class="panel recurring-panel"><div class="section-top"><h3>Recurring bills</h3><span class="budget-summary-meta">'+report.bills.length+' detected</span></div>'+listRecurring(report.bills)+'</div>'+
    (report.review.length?'<div class="panel recurring-panel"><div class="section-top"><h3>Subscriptions to review</h3><span class="budget-summary-meta">'+report.review.length+' uncertain</span></div>'+listRecurring(report.review,true)+'</div>':'')+
    '<div class="recurring-disclaimer">Estimates from local history; not bank-verified. One-off charges are excluded.</div>';
}
function gridStats(){const a=expense(),income=sum(rows().filter(x=>x.type==='income'));return'<div class="stats">'+[['Spent',money(sum(a))],['Income',money(income)],['Net cash flow',money(income-sum(a))]].map(x=>'<div class="stat"><div class="sub">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join('')+'</div>'}function list(a,max=999,kind=null,source=expense()){const top=Math.max(1,...a.map(x=>x.amount));return a.slice(0,max).map(x=>{const matching=kind?source.filter(t=>kind==='merchant'?cleanMerchant(t.merchant)===x.name:t.category===x.name).sort((a,b)=>b.date.localeCompare(a.date)):[];const line='<div style="flex:1;min-width:0"><b>'+esc(x.name)+'</b><div class="bar"><i style="width:'+(x.amount/top*100).toFixed(1)+'%"></i></div></div><div style="text-align:right"><strong>'+money(x.amount)+'</strong><div class="sub">'+x.count+' purchases</div></div>';if(!kind)return'<div class="row">'+line+'</div>';return'<details class="drill-detail"><summary class="row drill-summary">'+line+'<span class="chevron" aria-hidden="true">⌄</span></summary><div class="drill-expanded"><div class="sub">'+matching.length+' transactions • '+money(x.amount)+' total</div>'+table(matching)+'</div></details>'}).join('')||'<div class="empty">No data yet. Import a bank CSV or add a transaction.</div>'}function table(a){return'<div class="ledger-table-wrap"><table class="ledger-table"><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>'+a.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.merchant)+'<div class="transaction-source">'+esc(t.source?.provider==='plaid'?'Bank synced':t.source?.provider==='demo'?'Demo record':'Unverified legacy record')+'</div></td><td>'+esc(t.category)+(t.method==='learned'?'<div class="transaction-source">Learned from confirmed merchant rule</div>':t.suggested&&t.category!==t.suggested?'<div class="transaction-source">Suggested: '+esc(t.suggested)+'</div>':'')+'</td><td>'+esc(t.type)+'</td><td><strong>'+money(t.amount)+'</strong></td><td><button class="btn" data-category="'+esc(t.id)+'">Category</button></td></tr>').join('')+'</tbody></table></div>'}
function cashDateLabel(iso,year=false){return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',...(year?{year:'numeric'}:{})})}
function cashChart(series,lowestDate){
  // Cash-flow engine supplies 90 forecast days plus the opening snapshot.
  // The chart explicitly never draws more than that 90-day window.
  const horizon=Math.min(90,Math.max(0,series.length-1));
  const points=series.slice(0,horizon+1);
  const mobile=window.matchMedia('(max-width:700px)').matches;
  const w=mobile?560:960,h=mobile?156:148,l=mobile?88:90,r=mobile?16:20,t=10,b=mobile?30:28;
  const values=points.map(p=>p.balance);
  let min=Math.min(...values),max=Math.max(...values);
  const pad=Math.max(150,(max-min)*.10);
  min-=pad;max+=pad;
  const x=i=>l+i/Math.max(1,points.length-1)*(w-l-r);
  const y=n=>t+(max-n)/(max-min)*(h-t-b);
  const polyline=points.map((p,i)=>x(i).toFixed(1)+','+y(p.balance).toFixed(1)).join(' ');
  const lowIndex=points.findIndex(p=>p.date===lowestDate);
  const low=points[lowIndex>=0?lowIndex:0],lowX=x(lowIndex>=0?lowIndex:0);
  const grid=[0,.5,1].map(frac=>{
    const val=max-frac*(max-min),py=y(val);
    return '<line x1="'+l+'" y1="'+py.toFixed(1)+'" x2="'+(w-r)+'" y2="'+py.toFixed(1)+'" stroke="#e7eaee" stroke-width="1"/>'+
      '<text x="'+(l-7)+'" y="'+(py+4).toFixed(1)+'" font-size="'+(mobile?15:14)+'" fill="#66717c" text-anchor="end">'+esc(money(val))+'</text>';
  }).join('');
  const dateTicks=[0,Math.floor(horizon/2),horizon].map((i,j)=>'<text x="'+x(i).toFixed(1)+'" y="'+(h-8)+'" fill="#66717c" text-anchor="'+(j===0?'start':j===2?'end':'middle')+
    '" font-size="'+(mobile?15:14)+'">'+esc(cashDateLabel(points[i].date))+'</text>').join('');
  const zero=min<0&&max>0?'<line x1="'+l+'" y1="'+y(0).toFixed(1)+'" x2="'+(w-r)+'" y2="'+y(0).toFixed(1)+'" stroke="#c75a55" stroke-width="1.5" stroke-dasharray="5 6"/>':'';
  return '<svg class="cash-chart" role="img" aria-label="Projected balance over '+horizon+' days. Lowest '+esc(money(low.balance))+' on '+esc(cashDateLabel(low.date,true))+
   '." viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+grid+zero+
   '<polyline points="'+polyline+'" fill="none" stroke="#245dd8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+
   '<circle cx="'+lowX.toFixed(1)+'" cy="'+y(low.balance).toFixed(1)+'" r="5" fill="#b35a0b" stroke="#fff" stroke-width="2"/>'+dateTicks+'</svg>';
}

function previewCashFlow(){
 const bank=window.HouseholdBankFeed,engine=window.HouseholdCashFlow;
 const snapshot=bank.getSnapshot(today()),account=snapshot.accounts[0];
 // A simulated bank snapshot must never combine with unverified personal
 // transactions that a prior app version may have stored locally.
 const demoRows=entries().filter(t=>t.source?.provider==='demo');
 const source=demoRows.length?demoRows:window.createHouseholdLedgerDemo().transactions;
 const future=demoRows.length&&demoRows.length===entries().length?
   sharedForecast():window.HouseholdForecastLedger.build(data,source,today(),90,window.HouseholdForecast,Model);
 const f=engine.cashFlow90({account,asOf:snapshot.asOf,days:90,
   expectedEvents:future.events,uncertainty:future.uncertainty,source:snapshot.source,historyMonths:source.map(t=>t.date.slice(0,7))});
 return {snapshot,account,f,future};
}

 (p.events.length?p.events.map(e=>'<div class="cash-event">'+esc(e.merchant)+' — '+esc(e.type)+' · '+esc(money(e.amount))+'</div>').join(''):'<span class="muted">No scheduled payments</span>')+
 '</div></details></td><td>'+money(p.income)+'</td><td>'+money(p.outflow)+'</td><td><strong>'+money(p.balance)+'</strong></td></tr>').join('');
 const upcoming=future.events.filter(e=>e.type==='expense'&&(!e.account||e.account===account.transactionAccount)).slice(0,22);
 const nextRows=upcoming.map(v=>'<div class="row forecast-row"><span>'+esc(v.merchant)+' <small>· '+esc(v.category)+' · '+esc(v.date)+'</small></span>'+
 '<strong>'+money(v.amount)+'</strong><button class="btn" data-forecast-jump="'+esc(v.category)+'">Review</button></div>').join('');
 const added=future.events.filter(e=>e.source==='manual'&&e.category==='One-time forecast').map(v=>'<div class="row forecast-row"><span>'+
 esc(v.merchant)+' <small>· '+esc(v.date)+'</small></span><strong>'+money(v.amount)+'</strong><button class="btn" data-event="'+esc(v.id)+'">Edit</button></div>').join('');
 const risk=future.uncertainty;
 const riskDisplay=risk?.available?'<div class="cash-risk" aria-label="Unscheduled spending scenario"><span>Illustrative 90-day balance with irregular spending</span>'+

 const controls='<details class="cash-detail forecast-editor"><summary>Review future payments</summary>'+

 (nextRows||'<div class="empty">No scheduled expenses supported by available history.</div>')+
 '<div class="section-top"><h3>One-time forecast adjustments</h3><button class="btn" data-add-event="1">Add projection</button></div>'+
 (added||'<div class="empty">None added.</div>')+
 '<p class="prediction-note">Edit a scheduled expense in its Budget category; the same date and amount update this cash-flow chart. Only explicitly directed checking transfers are included as cash movements, not purchases. Undated spending is shown separately as a statistical scenario.</p></details>';
 return '<div class="cash-panel" id="cashflow"><div class="cash-head"><div><h3>Lowest scheduled-only balance · next 90 days</h3>'+
 '<div class="cash-sub">'+esc(account.name)+' · '+esc(f.balanceBasis)+' balance</div></div><span class="cash-demo">SIMULATED BANK DATA</span></div>'+
 '<div class="cash-hero"><div><div class="cash-primary-amount">'+money(f.minimum)+'</div>'+
 '<div class="cash-primary-date">Lowest on '+esc(cashDateLabel(f.lowestDate,true))+'</div></div>'+
 '<div class="cash-secondary"><div><span class="sub">Available now</span><strong>'+money(f.opening)+'</strong></div>'+
 '<div><span class="sub">In 90 days</span><strong>'+money(f.closing)+'</strong></div></div></div>'+
 cashChart(f.series,f.lowestDate)+riskDisplay+controls+
 '<div class="cash-status">90 days · '+future.events.length+' scheduled items including directed transfers · Undated spending excluded from chart line</div>'+
 '<details class="cash-detail"><summary>Explore 90-day cash flow</summary>'+
 '<div class="cash-table-wrap cash-days-wrap"><table class="cash-table daily-cash-table"><thead>'+
 '<tr><th>Date / expected items</th><th>Income</th><th>Outflow</th><th>End-of-day balance</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
 '<p class="cash-explain">Fictional bank balance. No Plaid connection. This illustrates recurring event cash flow and does not guarantee an actual balance or account funding availability.</p></details></div>';

}

function learnedRulesMarkup(){
 const cats=Object.entries(data.learning?.categoryRules||{}),patterns=Object.entries(data.predictions?.patternRules||{});
 const categoryRows=cats.map(([key,r])=>'<div class="learning-rule" data-learned-category="'+esc(key)+'"><span><strong>'+esc(r.merchant)+'</strong>'+
  '<small>'+esc(r.account)+' · '+esc(r.mode==='auto'?'Automatic for uncategorized/low-confidence expenses':'Suggest only: confirm each ambiguous purchase')+
  ' · '+esc(r.reason||'Your correction')+'</small></span><strong>'+esc(r.category)+'</strong><button class="btn" type="button" data-forget-category="'+esc(key)+'">Remove rule</button></div>').join('');
 const patternRows=patterns.map(([key,r])=>{
  const parts=key.split('|').map(p=>{try{return decodeURIComponent(p)}catch{return p}});
  const label=parts[3]||'Merchant',cadence=r.mode==='none'?'Not recurring':r.mode==='monthly'?'Confirmed monthly':r.mode==='trust'?'Confirmed '+(r.cadence||'pattern'):r.mode;
  return '<div class="learning-rule" data-learned-pattern="'+esc(key)+'"><span><strong>'+esc(label)+'</strong><small>'+esc(parts[2]||'Account')+' · '+esc(cadence)+
   (r.mode==='trust'?' · Amount and date still learn from history':'')+'</small></span><button class="btn" type="button" data-forget-pattern="'+esc(key)+'">Restore automatic</button></div>';
 }).join('');
 return '<details class="learned-rules"><summary>Learned rules <span>'+String(cats.length+patterns.length)+'</span></summary>'+
 '<p class="prediction-note">Review decisions can carry forward to similar transactions and future predictions. All rules stay separate from the bank ledger. Removing a rule never deletes the original review decision or changes bank records.</p>'+
 '<div class="section-top"><h3>Category rules</h3></div>'+(categoryRows||'<p class="prediction-note">No learned category rules yet.</p>')+
 '<div class="section-top"><h3>Recurring-payment rules</h3></div>'+(patternRows||'<p class="prediction-note">No confirmed recurrence rules yet.</p>')+
 '</details>';
}
function learnReviewedPrediction(task,modified){
 if(task.kind!=='prediction'||!task.cadence||!task.account)return;
 const key=window.HouseholdForecast.patternKey('expense',task.category,task.account,task.merchant);
 if(modified&&task.cadence==='monthly'){
  Model.setPatternRule(data,key,{mode:'monthly',day:Number(modified.date.slice(8,10)),amount:Number(modified.amount)});
 }else if(!modified){
  Model.setPatternRule(data,key,{mode:'trust',cadence:task.cadence,day:Number(task.date.slice(8,10)),amount:Number(task.amount)});
 }
}

function accuracyView(){
 // This evaluation is deliberately isolated from data/localStorage, including
 // user-categorized transactions and imported legacy rows.
 try{
  if(!accuracyReport)accuracyReport=window.HouseholdAccuracyLab.runFixture(window.HouseholdAccuracyFixture,
   window.HouseholdForecast,window.HouseholdForecastLedger,Model);
 }catch(err){
  return '<div class="panel accuracy-lab"><h3>Historical accuracy test</h3><p class="prediction-note">Fictional test temporarily unavailable: '+esc(err.message)+'</p></div>';
 }
 const s=accuracyReport.score,primary=s.recurring;
 const percent=x=>x===null?'Not measurable':x.toFixed(1)+'%';
 const num=x=>x===null?'N/A':String(x.toFixed(2)).replace(/\.00$/,'');
 const stat=(name,value,subtitle)=>'<div class="accuracy-stat"><span>'+esc(name)+'</span><strong>'+esc(value)+'</strong><small>'+esc(subtitle)+'</small></div>';
 const maxErr=Math.max(1,...s.cash.map(x=>x.mae));
 const cash=s.cash.map(x=>'<div class="accuracy-cash-row"><span>'+x.days+' days</span>'+
  '<div class="accuracy-track"><i style="width:'+((x.mae/maxErr)*100).toFixed(1)+'%"></i></div>'+
  '<strong>'+money(x.mae)+'</strong><small>Average absolute error</small></div>').join('');
 const scoreTable=(items,kind)=>'<div class="accuracy-table-wrap"><table class="accuracy-table"><thead>'+
  '<tr><th>'+esc(kind)+'</th><th>Predicted</th><th>Matched</th><th>Missed</th><th>False</th><th>Precision</th><th>Recall</th></tr></thead><tbody>'+
  items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.predicted+'</td><td>'+x.matched+'</td><td>'+x.missedRecurring+'</td><td>'+x.falsePredictions+'</td>'+
   '<td>'+esc(percent(x.precision))+'</td><td>'+esc(percent(x.recall))+'</td></tr>').join('')+
  '</tbody></table></div>';
 const snapshots='<div class="accuracy-table-wrap"><table class="accuracy-table"><thead><tr><th>Forecast made</th><th>Precision</th><th>Recall</th><th>90-day balance error</th></tr></thead><tbody>'+
  accuracyReport.folds.map(x=>'<tr><td>'+esc(x.asOf)+'</td><td>'+esc(percent(x.precision))+'</td>'+
  '<td>'+esc(percent(x.recall))+'</td><td>'+money(x.cash.find(c=>c.days===90).absoluteError)+'</td></tr>').join('')+
  '</tbody></table></div>';
 const examples=accuracyReport.score.examples;
 const errors='<div class="accuracy-examples"><div><strong>Examples of missed repeating payments</strong>'+
  (examples.missedRecurring.length?examples.missedRecurring.slice(0,4).map(e=>'<p>'+esc(e.merchant)+' · '+esc(e.date)+' · '+esc(e.asOf)+'</p>').join(''):'<p>No examples in these windows.</p>')+
  '</div><div><strong>Examples of false predictions</strong>'+
  (examples.falsePredictions.length?examples.falsePredictions.slice(0,4).map(e=>'<p>'+esc(e.merchant)+' · '+esc(e.date)+' · '+esc(e.asOf)+'</p>').join(''):'<p>No examples in these windows.</p>')+'</div></div>';
 return '<section class="panel accuracy-lab" aria-label="Historical accuracy laboratory">'+
  '<div class="section-top"><div><h3>Prediction accuracy lab</h3><p class="prediction-note">FICTIONAL HISTORY ONLY · Not a score for your household</p></div>'+
  '<button class="btn" type="button" id="rerun-accuracy">Run again</button></div>'+
  '<p class="accuracy-intro">We rewound the same 25-month fictional household to '+s.snapshots+
  ' historical dates. At each one, future transactions were hidden from the predictor and used only afterward to score its 90-day forecast.</p>'+
  '<div class="accuracy-stats">'+
  stat('Recurring precision',percent(primary.precision),'Of '+primary.predicted+' predicted charges or deposits, '+primary.matched+' matched')+
  stat('Recurring recall',percent(primary.recall),primary.matched+' of '+primary.actualRecurring+' actual repeating transactions anticipated')+
  stat('Date error',primary.averageDateErrorDays===null?'N/A':num(primary.averageDateErrorDays)+' days','Average on correctly matched recurring events')+
  stat('Amount error',primary.averageAmountError===null?'N/A':money(primary.averageAmountError),'Average absolute error on matched events')+
  '</div>'+
  '<div class="accuracy-detail-line"><span>'+primary.falsePredictions+' false predictions</span><span>'+primary.missedRecurring+
  ' missed recurring events</span><span>'+percent(s.scheduledExpenseCoverage)+' of total expenses covered by matched scheduled charges</span></div>'+
  '<div class="section-top"><h3>Cash balance error by forecast horizon</h3></div>'+
  '<p class="prediction-note">Mean absolute balance error across '+s.snapshots+
  ' fictional anchored-balance simulations. The model does not yet forecast irregular spending or checking transfers, so errors can be large.</p>'+cash+
  '<details class="accuracy-detail"><summary>Accuracy by spending category</summary>'+
  scoreTable(s.byCategory,'Category')+'</details>'+
  '<details class="accuracy-detail"><summary>Accuracy by recurrence pattern</summary>'+scoreTable(s.byCadence,'Pattern')+'</details>'+
  '<details class="accuracy-detail"><summary>Reliability by prediction confidence</summary>'+
  '<p class="prediction-note">Hit rate by model confidence, not calibrated probability.</p>'+
  '<div class="accuracy-table-wrap"><table class="accuracy-table"><thead><tr><th>Confidence</th><th>Predictions</th><th>Matched</th><th>Hit rate</th></tr></thead><tbody>'+
   s.byConfidence.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.predicted+'</td><td>'+x.matched+'</td><td>'+esc(percent(x.precision))+'</td></tr>').join('')+
  '</tbody></table></div></details>'+
  '<details class="accuracy-detail"><summary>All '+s.snapshots+' historical forecast windows</summary>'+snapshots+'</details>'+
  '<details class="accuracy-detail"><summary>Example prediction mistakes</summary>'+errors+'</details>'+
  '<div class="accuracy-method"><strong>How to interpret this test</strong>'+
   '<p>These are historical test-window opportunities; overlapping 90-day windows intentionally count a payment more than once. Matching requires the same merchant, account, money direction and a date within 2–5 days. Irregular purchases are excluded from the recurring-recall denominator but still contribute to real spending and cash errors.</p>'+
   '<p>Opening balances are mathematically constructed from fictional transactions, not fetched from a bank. Credit-card settlement transfers reduce checking cash without being categorized as spending; the current forecast does not schedule them. This helps reveal why the 90-day balance projection is not yet dependable.</p>'+
   '<p>No bank data, local ledger records, or user rules are read, imported, changed or sent anywhere by this lab.</p></div>'+
  '</section>';
}

  '<div class="drill-expanded"><div class="section-top"><h3>'+esc(category)+' · '+esc(month)+'</h3><button class="btn" data-budget="'+esc(category)+'">Edit budget target</button></div>'+
  predictedCategoryMarkup(f,category,month)+recurrenceRulesMarkup(category)+
  '<div class="recorded-section"><div class="section-top"><h3>Recorded transactions</h3><strong>'+money(f.actual)+'</strong></div>'+
  (matching.length?table(matching):'<div class="empty">No posted expenses in this category for the selected month.</div>')+'</div>'+
  (currentMonth?'<p class="prediction-note">Automatic predictions based on '+f.historyMonths.length+' historical months; never guaranteed. Monthly category expected amount = sum of active dated predictions.</p>':'')+
  '</div></details></div>';
 }).join('')+'</div>';
}

 '<p>Plaid connection is not yet enabled. Do not enter bank credentials on this static site.</p><button class="btn" id="backup">Export local snapshot</button></div>'+

document.querySelectorAll('[data-review-prediction]').forEach(form=>form.onsubmit=e=>{

  const fields=new FormData(form),date=String(fields.get('date'));

 }catch(err){alert(err.message)}
});
document.querySelectorAll('[data-review-confirm]').forEach(button=>button.onclick=()=>{
 const task=taskById(button.dataset.reviewConfirm);if(!task)return;
 try{
  if(task.kind==='category'){
   const form=button.closest('[data-review-category]'),choice=String(new FormData(form).get('category'));
   // Confirming the current choice saves a reusable rule if requested.
   if(choice!==task.category){Model.setCategory(data,task.targetId,choice);}
   if(form.querySelector('[name=remember]')?.checked&&choice!=='Other')Model.learnCategory(data,task.targetId,choice);
  }else if(task.kind==='prediction'){learnReviewedPrediction(task,null)}
  window.HouseholdReviews.confirm(data,task);finishReview();
 }catch(err){alert(err.message)}
});

 try{

document.querySelectorAll('[data-pattern-rule-form]').forEach(form=>{
 const select=form.querySelector('[name=key]'),mode=form.querySelector('[name=mode]');
 const fill=()=>{
  const choice=select.selectedOptions[0];
  form.querySelector('[name=amount]').value=choice.dataset.amount||'0';
  form.querySelector('[name=day]').value=choice.dataset.day||'1';
  mode.value=data.predictions.patternRules?.[select.value]?.mode||'auto';
  const rule=data.predictions.patternRules?.[select.value];
  if(rule?.mode==='monthly'){form.querySelector('[name=amount]').value=rule.amount;form.querySelector('[name=day]').value=rule.day}
 };
 select.onchange=fill;fill();
 form.onsubmit=e=>{
  e.preventDefault();
  const fields=new FormData(form),category=form.dataset.patternRuleForm,key=String(fields.get('key')),kind=String(fields.get('mode'));
  try{
   const previous=data.predictions.patternRules?.[key];
   if(kind==='trust'){
    if(previous?.mode!=='trust')throw Error('Confirm this recurrence from Reviews first');
    Model.setPatternRule(data,key,{...previous,mode:'trust'});
   }else Model.setPatternRule(data,key,kind==='auto'?null:{mode:kind,day:fields.get('day'),amount:fields.get('amount')});
   save();refreshCategory(category);
  }catch(err){alert(err.message)}
 };
});
document.querySelectorAll('[data-pattern-none]').forEach(button=>button.onclick=()=>{

document.querySelectorAll('[data-expected-form]').forEach(form=>form.onsubmit=e=>{
 e.preventDefault();

 try{
  const item=monthlyProjection(budgetMonth,category).expected.find(x=>x.id===id);
  if(!item)throw Error('Forecast no longer available');
  const date=String(fields.get('date'));
  if(!date.startsWith(budgetMonth)||date<=today())throw Error('Please choose a future date within the selected month');
  if(id.startsWith('manual|'))Model.saveManualExpected(data,{...item,merchant:fields.get('merchant'),date,amount:fields.get('amount'),enabled:fields.has('enabled')});
  else Model.updateExpectedTransaction(data,id,{date,amount:fields.get('amount'),enabled:fields.has('enabled')});
  save();refreshCategory(category);
 }catch(err){alert(err.message)}
});

 if(!date.startsWith(budgetMonth)||date<=today()){alert('Expected date must be later this month');return}

function download(s,name,mime){let u=URL.createObjectURL(new Blob([s],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function showEditor(content){
 el('flash').innerHTML='<div class="panel editable-forecast">'+content+'</div>';
 window.scrollTo({top:0,left:0,behavior:'instant'});
}
function bindCancel(){el('cancel').onclick=()=>el('flash').innerHTML=''}
function categoryForm(id){
 const record=data.transactions.find(t=>t.id===id);if(!record)return;
 const current=Model.categoryFor(data,id),safety=Model.categoryRuleSafety(data,record),prior=Model.resolution(data,record);
 const options=CATS.map(c=>'<option value="'+esc(c)+'" '+(c===current?'selected':'')+'>'+esc(c)+'</option>').join('');
 showEditor('<h3>Change category</h3><div class="readonly-transaction"><strong>'+esc(record.merchant)+'</strong> · '+money(record.amount)+' · '+esc(record.date)+
 '<div class="transaction-source">Source transaction is read-only.'+(prior.method==='learned'?' Category supplied by a learned rule.':'')+'</div></div>'+
 '<form id="entry"><label>Category<select name="category">'+options+'</select></label>'+
 (record.type==='expense'?'<label class="learn-checkbox"><input type="checkbox" name="remember" '+(safety.mixed?'':'checked')+'> Remember this merchant for future purchases</label>':'')+
 '<p class="prediction-note">'+esc(safety.mixed?'Multi-purpose or conflicting merchant: saving a rule will suggest categories for review, not force every purchase.':
 'Consistent merchant: saved rules apply automatically to new unclassified or low-confidence expenses from the same account.')+'</p>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save category</button><button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{
  const fields=new FormData(e.target),category=String(fields.get('category'));
  Model.setCategory(data,id,category);
  if(record.type==='expense'&&fields.has('remember')&&category!=='Other')Model.learnCategory(data,id,category);
  save();render();alertMsg('Category saved. Original bank record unchanged.');
 }catch(err){alert(err.message)}};
 bindCancel();
}
function budgetPredictionForm(category,month){
 const f=monthlyProjection(month,category),budget=data.predictions.monthlyBudgets[category]||0;
 showEditor('<h3>Monthly budget target · '+esc(category)+'</h3>'+
 '<p class="prediction-note">Actual spending '+money(f.actual)+' is read-only. '+f.active.length+' individually dated expected transactions total '+money(f.additional)+'. Expand the category to edit those payments individually.</p>'+
 '<form id="entry"><label>Monthly budget ($)<input name="budget" type="number" min="0" step=".01" required value="'+esc(budget)+'"></label>'+
 '<div class="editor-actions"><button type="submit" class="btn primary">Save budget</button><button type="button" class="btn" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{Model.setMonthlyBudget(data,category,new FormData(e.target).get('budget'));save();render();alertMsg('Monthly budget updated. Actuals and individual predictions unchanged.')}catch(err){alert(err.message)}};
 bindCancel();
}
function projectedCashFlow(){
 const snapshot=window.HouseholdBankFeed.getSnapshot(today()),account=snapshot.accounts[0];
 const history=snapshot.mode==='demo'&&window.createHouseholdLedgerDemo?window.createHouseholdLedgerDemo().transactions:entries();
 const model=window.HouseholdCashFlow.cashFlow90({account,asOf:snapshot.asOf,days:90,transactions:history,
 predictionOverrides:{streams:data.predictions.cashFlowStreams,events:data.predictions.cashFlowEvents,dailyVariable:data.predictions.dailyVariable}});
 return {account,model};
}
function streamPredictionForm(key){
 const {model}=projectedCashFlow(),stream=model.streams.find(s=>s.key===key);if(!stream)return;
 showEditor('<h3>Adjust predicted payment</h3><div class="readonly-transaction">'+esc(stream.merchant)+' · '+esc(stream.type)+'<div class="transaction-source">Prediction only; no bank record modified.</div></div>'+
 '<form id="entry"><div class="formgrid"><label>Expected amount ($)<input name="amount" type="number" min="0" step=".01" required value="'+stream.amount+'"></label>'+
 '<label>Expected day of month<input name="day" type="number" min="1" max="31" step="1" required value="'+stream.day+'"></label></div>'+
 '<label class="toggle-forecast"><input type="checkbox" name="enabled" '+(stream.enabled?'checked':'')+'> Include predicted payment</label>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save prediction</button><button class="btn" type="button" id="reset-prediction">Reset to model</button><button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);Model.setStreamOverride(data,key,{amount:f.get('amount'),day:Number(f.get('day')),enabled:f.has('enabled')});save();render();alertMsg('Predicted payment updated.')}catch(err){alert(err.message)}};
 el('reset-prediction').onclick=()=>{Model.setStreamOverride(data,key,null);save();render();alertMsg('Automatic prediction restored.')};
 bindCancel();
}
function dailyPredictionForm(){
 const {model}=projectedCashFlow();
 showEditor('<h3>Expected daily spending</h3><form id="entry"><label>Predicted variable spending ($ per day)<input name="amount" type="number" min="0" step=".01" required value="'+esc(data.predictions.dailyVariable??model.dailyVariable)+'"></label>'+
 '<p class="prediction-note">Changes only future balances; not posted transactions.</p>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save prediction</button><button class="btn" type="button" id="reset-prediction">Use automatic estimate</button><button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{Model.setDailyVariable(data,new FormData(e.target).get('amount'));save();render();alertMsg('Daily forecast updated.')}catch(err){alert(err.message)}};
 el('reset-prediction').onclick=()=>{Model.setDailyVariable(data,null);save();render();alertMsg('Automatic estimate restored.')};
 bindCancel();
}
function eventPredictionForm(id){
 const {account}=previewCashFlow(),old=data.predictions.cashFlowEvents.find(e=>e.id===id);
 const event=old||{date:today(),type:'expense',amount:'',description:''};
 showEditor('<h3>'+(old?'Edit':'Add')+' projected event</h3><p class="prediction-note">This is a forecast, not a bank transaction.</p>'+
 '<form id="entry"><div class="formgrid"><label>Expected date<input name="date" type="date" required value="'+esc(event.date)+'"></label>'+
 '<label>Amount ($)<input name="amount" type="number" min=".01" step=".01" required value="'+esc(event.amount)+'"></label>'+
 '<label>Direction<select name="type"><option value="expense" '+(event.type==='expense'?'selected':'')+'>Money out</option><option value="income" '+(event.type==='income'?'selected':'')+'>Money in</option></select></label>'+
 '<label>Description<input name="description" type="text" maxlength="160" required value="'+esc(event.description)+'"></label></div>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save prediction</button>'+(old?'<button class="btn danger" id="remove-prediction" type="button">Remove prediction</button>':'')+
 '<button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);Model.saveEvent(data,{id,date:f.get('date'),amount:f.get('amount'),type:f.get('type'),description:f.get('description'),accountId:account.id});save();render();alertMsg('Forecast event saved.')}catch(err){alert(err.message)}};
 if(old)el('remove-prediction').onclick=()=>{Model.removeEvent(data,id);save();render();alertMsg('Prediction removed. Ledger unchanged.')};
 bindCancel();
}
function navigateTo(next){window.scrollTo({top:0,left:0,behavior:'instant'});page=next;render();window.scrollTo({top:0,left:0,behavior:'instant'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigateTo(b.dataset.page));el('period').onchange=e=>{if(page==='budgets'){budgetMonth=e.target.value;period=e.target.value}else{period=e.target.value;if(period!=='all')budgetMonth=period}render()};render()})();
</script></body></html>
