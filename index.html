<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18242e">
<meta name="ledger-ui-revision" content="calendar-toolbar-width-20261025-v1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Household Ledger · Balance Planner</title>
<link rel="stylesheet" href="planner.css?v=prediction-review-labels-v1">
</head>
<body>
<main class="shell"><div class="content">
  <header class="topbar">
    <div>
      <h1>Household Ledger</h1>
    </div>
    <div class="top-actions">
      <details class="planner-menu" id="planner-menu"><summary aria-label="Open other planning tools">☰ <span>More</span></summary>
        <div class="planner-menu-content" role="group" aria-label="Other planning tools">
          <button type="button" data-view="transactions">All Predictions</button>
          <button type="button" data-view="trend">Balance Trend</button>
          <button type="button" data-view="settings">Settings</button>
          <div class="planner-menu-bank">
            <label for="ledger-mode-switch">Data source</label>
            <select id="ledger-mode-switch" class="mode-box" aria-label="Bank data source"><option value="demo">Demo</option><option value="real">Real / Plaid</option></select>
            <span class="status-tag" id="source-type" aria-live="polite">DEMO DATA</span>
            <button class="btn" type="button" id="refresh-bank" hidden>Refresh bank</button>
            <a class="btn" id="bank-connect" href="/bank-connect" hidden>Bank connections</a>
          </div>
          <button class="btn primary" type="button" id="audit-launch" data-run-backtest hidden>Check accuracy</button>
          <small id="deployment-version">Focused Review v1 · Server not verified</small>
        </div>
      </details>
    </div>
  </header>
  <nav class="planner-tabs planner-nav-primary" aria-label="Main planner navigation">
    <button type="button" class="tab-link active" data-view="summary" aria-current="page">Calendar</button>
     <button type="button" class="tab-link" data-view="schedules">Predictions</button>
    <button type="button" class="tab-link" data-view="history">Transactions</button>
    <button type="button" class="tab-link" data-view="reviews">Review<span class="review-tab-count" data-review-tab-count hidden></span></button>
  </nav>
  <div id="planner-notice" aria-live="polite"></div>
  <div id="planner-main" aria-live="polite"><div class="panel">Preparing your balance plan…</div></div>
  <footer id="planner-fine-print" class="planner-fine-print" hidden></footer>
  </div></main>
<script src="demo-data.js"></script>
<script src="bank-feed.js"></script>
<script src="accounting.js?v=card-payment-priority-v3"></script>
<script src="categorization.js"></script>
<script src="ledger-data.js?v=unified-categories-v1"></script>
<script src="payment-obligations.js?v=card-settlements-excluded-v2"></script>
<script src="planner-transactions.js?v=rollback-before-manual-windows-20261027-v1"></script>
<script src="planner-history.js?v=prediction-review-labels-v1"></script>
<script src="planner-core.js?v=rollback-before-manual-windows-20261027-v1"></script>
<script src="planner-coverage.js?v=prediction-review-labels-v1"></script>
<script src="planner-summary.js?v=rollback-before-manual-windows-20261027-v1"></script>
<script src="planner.js?v=rollback-before-manual-windows-20261027-v1"></script>
<noscript>JavaScript is required to display account balances and planning projections.</noscript>
</body>
</html>
