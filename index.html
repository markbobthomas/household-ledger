function cleanMerchant(s){let u=s.toUpperCase();if(u.includes('COSTCO'))return /GAS|FUEL|PUMP/.test(u)?'Costco Gas':'Costco Warehouse';if(/AMAZON|AMZN/.test(u))return 'Amazon';if(u.includes('WALMART')||u.includes('WAL-MART'))return 'Walmart';if(u.includes('SAFEWAY'))return 'Safeway';return s.trim()}function type(s,n){if(/TRANSFER|PAYMENT TO|CARD PAYMENT|AUTOPAY|CREDIT CARD PAYMENT/i.test(s))return 'transfer';if(/PAYROLL|DIRECT DEPOSIT|REFUND|DEPOSIT/i.test(s))return 'income';return n>0?'income':'expense'}function category(s){s=s.toLowerCase();if(/costco gas|shell|chevron|fuel|exxon/.test(s))return'Transportation';if(/costco|safeway|grocery|trader joe|kroger/.test(s))return'Groceries';if(/amazon|walmart|target|ebay|home depot/.test(s))return'Shopping';if(/mortgage|rent/.test(s))return'Housing';if(/water|electric|internet|utility|xfinity|verizon/.test(s))return'Utilities';if(/restaurant|coffee|pizza|cafe/.test(s))return'Dining';return'Other'}function rows(){return entries().filter(t=>period==='all'||t.date.slice(0,7)===period)}function expense(){return rows().filter(t=>['expense','refund'].includes(t.type))}function sum(a){return a.reduce((s,x)=>s+Number(x.type==='income'?(x.earnedIncomeAmount??x.amount??0):(x.spendingAmount??x.amount??0)),0)}function grouped(a,field){const o={};a.forEach(t=>{const k=field==='merchant'?cleanMerchant(t.merchant):t.category;o[k]??={name:k,amount:0,count:0};o[k].amount+=Number(t.spendingAmount??t.amount??0);o[k].count++});return Object.values(o).sort((a,b)=>b.amount-a.amount)}function recurringInsights(tabs){

    manual?'You confirmed this payment schedule. Dates and amounts are forecast assumptions, not bank facts.':

      (manual?'<button class="btn" type="button" data-recurring-reset="'+esc(g.ruleKey)+'" data-recurring-tx="'+esc(example.id)+'">Use automatic detection</button>':''))+

   return'<details class="drill-detail recurring-detail" data-recurring-key="'+esc(g.ruleKey)+'"><summary class="row drill-summary">'+

function gridStats(){const a=expense(),income=sum(rows().filter(x=>x.type==='income'));return'<div class="stats">'+[['Spent',money(sum(a))],['Income',money(income)],['Net cash flow',money(income-sum(a))]].map(x=>'<div class="stat"><div class="sub">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join('')+'</div>'}function list(a,max=999,kind=null,source=expense()){const top=Math.max(1,...a.map(x=>x.amount));return a.slice(0,max).map(x=>{const matching=kind?source.filter(t=>kind==='merchant'?cleanMerchant(t.merchant)===x.name:t.category===x.name).sort((a,b)=>b.date.localeCompare(a.date)):[];const line='<div style="flex:1;min-width:0"><b>'+esc(x.name)+'</b><div class="bar"><i style="width:'+(x.amount/top*100).toFixed(1)+'%"></i></div></div><div style="text-align:right"><strong>'+money(x.amount)+'</strong><div class="sub">'+x.count+' purchases</div></div>';if(!kind)return'<div class="row">'+line+'</div>';return'<details class="drill-detail" data-report-group="'+esc(kind+'|'+x.name)+'"><summary class="row drill-summary">'+line+'<span class="chevron" aria-hidden="true">⌄</span></summary><div class="drill-expanded"><div class="sub">'+matching.length+' transactions • '+money(x.amount)+' total</div>'+table(matching)+'</div></details>'}).join('')||'<div class="empty">No data yet. Import a bank CSV or add a transaction.</div>'}function table(a,activity=false){
 const detected=activity?new Set(sharedForecast().events.filter(e=>['expense','income','transfer'].includes(e.type))
  .map(e=>window.HouseholdForecast.patternKey(e.type,e.type==='income'||e.type==='transfer'?'Income':e.category,

 return'<div class="ledger-table-wrap"><table class="ledger-table"><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Type</th><th>Amount</th>'+
 (activity?'<th>Recurring</th>':'')+'</tr></thead><tbody>'+
 a.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.merchant)+
 '<div class="transaction-source">'+esc(t.source?.simulated?'Sandbox test':t.source?.provider==='plaid'?'Bank synced':t.source?.provider==='demo'?'Demo record':'Unverified legacy record')+(t.pairedTransactionId?' · Matched transfer':t.reconciliationStatus==='needs-review'?' · Classification needs review':'')+'</div></td><td>'+
 categoryControl(t.id,t.category,t.merchant)+(t.method==='learned'?'<div class="transaction-source">Learned from confirmed merchant rule</div>':
 t.method==='plaid-category'?'<div class="transaction-source">Auto · Plaid category</div>':
 t.method==='merchant-match'?'<div class="transaction-source">Auto · Merchant match</div>':
 t.source?.provider==='plaid'&&t.category==='Other'&&['expense','refund'].includes(t.type)?
  '<div class="transaction-source">Needs category · choose one above</div>':
 t.suggested&&t.category!==t.suggested?'<div class="transaction-source">Suggested: '+esc(t.suggested)+'</div>':'')+
 '</td><td>'+esc(t.accountingKind==='card_payment'?'Card payment':t.accountingKind==='internal_transfer'?'Transfer':t.accountingKind==='refund'?'Refund':t.type)+'</td><td><strong>'+money(t.type==='refund'?-t.amount:t.amount)+'</strong></td>'+
 (activity?'<td class="recurring-cell">'+recurringControl(t,detected)+'</td>':'')+'</tr>').join('')+'</tbody></table></div>';

function recurringControl(t,detected){
 if(!['expense','income','transfer'].includes(t.type))
  return '<span class="recurring-na" title="Recurrence is available for spending, income and transfers">—</span>';
 const key=window.HouseholdForecast.patternKey(t.type,t.type==='income'||t.type==='transfer'?'Income':t.category,
  String(t.accountId||t.account||'Unknown'),t.merchant);
 const rule=data.predictions.patternRules?.[key];
 const freq=rule?.mode==='schedule'?rule.frequency:rule?.mode==='monthly'?'monthly':null;
 const names={weekly:'Weekly',biweekly:'Every 2 weeks',monthly:'Monthly',quarterly:'Quarterly',
  semiannual:'Every 6 months',annual:'Yearly'};
 const automatic=detected?.has(key);
 const selected=rule?.mode==='none'?'none':freq?'schedule':rule?.mode==='trust'?'trust':automatic?'auto':'choose';

  selected==='trust'?'Confirmed pattern':automatic?'Detected':'+ Set recurring';

  ...(selected==='choose'?[['choose','+ Set recurring']]:[]),
  ['auto',selected==='auto'&&automatic?'Detected':'Automatic detection'],

 ];

 return '<select class="editable-value inline-category-native recurring-value'+

  ' title="Change recurrence for this merchant, account and category"'+
  ' aria-label="Change recurrence for '+esc(t.merchant)+'">'+
  choices.map(([value,text])=>'<option value="'+value+'" '+(selected===value?'selected':'')+'>'+
   esc(text)+'</option>').join('')+'</select>';
}

function cashDateLabel(iso,year=false){return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',...(year?{year:'numeric'}:{})})}
function cashChart(series,lowestDate){
  // Cash-flow engine supplies 90 forecast days plus the opening snapshot.
  // The chart explicitly never draws more than that 90-day window.
  const horizon=Math.min(90,Math.max(0,series.length-1));
  const points=series.slice(0,horizon+1);
  const mobile=window.matchMedia('(max-width:700px)').matches;
  const w=mobile?560:960,h=mobile?156:148,l=mobile?88:90,r=mobile?16:20,t=10,b=mobile?30:28;
  const values=points.map(p=>p.balance);
  let min=Math.min(...values),max=Math.max(...values);
  const pad=Math.max(150,(max-min)*.10);
  min-=pad;max+=pad;
  const x=i=>l+i/Math.max(1,points.length-1)*(w-l-r);
  const y=n=>t+(max-n)/(max-min)*(h-t-b);
  const polyline=points.map((p,i)=>x(i).toFixed(1)+','+y(p.balance).toFixed(1)).join(' ');
  const lowIndex=points.findIndex(p=>p.date===lowestDate);
  const low=points[lowIndex>=0?lowIndex:0],lowX=x(lowIndex>=0?lowIndex:0);
  const grid=[0,.5,1].map(frac=>{
    const val=max-frac*(max-min),py=y(val);
    return '<line x1="'+l+'" y1="'+py.toFixed(1)+'" x2="'+(w-r)+'" y2="'+py.toFixed(1)+'" stroke="#e7eaee" stroke-width="1"/>'+
      '<text x="'+(l-7)+'" y="'+(py+4).toFixed(1)+'" font-size="'+(mobile?15:14)+'" fill="#66717c" text-anchor="end">'+esc(money(val))+'</text>';
  }).join('');
  const dateTicks=[0,Math.floor(horizon/2),horizon].map((i,j)=>'<text x="'+x(i).toFixed(1)+'" y="'+(h-8)+'" fill="#66717c" text-anchor="'+(j===0?'start':j===2?'end':'middle')+
    '" font-size="'+(mobile?15:14)+'">'+esc(cashDateLabel(points[i].date))+'</text>').join('');
  const zero=min<0&&max>0?'<line x1="'+l+'" y1="'+y(0).toFixed(1)+'" x2="'+(w-r)+'" y2="'+y(0).toFixed(1)+'" stroke="#c75a55" stroke-width="1.5" stroke-dasharray="5 6"/>':'';
  return '<svg class="cash-chart" role="img" aria-label="Projected balance over '+horizon+' days. Lowest '+esc(money(low.balance))+' on '+esc(cashDateLabel(low.date,true))+
   '." viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+grid+zero+
   '<polyline points="'+polyline+'" fill="none" stroke="#245dd8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+
   '<circle cx="'+lowX.toFixed(1)+'" cy="'+y(low.balance).toFixed(1)+'" r="5" fill="#b35a0b" stroke="#fff" stroke-width="2"/>'+dateTicks+'</svg>';
}

function previewCashFlow(){

 const snapshot=bank.getSnapshot(today()),account=snapshot.accounts.find(a=>['checking','savings','depository'].includes(String(a.accountType||a.type).toLowerCase()))||snapshot.accounts[0];
 // A simulated bank snapshot must never combine with unverified personal

 const demoRows=entries().filter(t=>t.source?.provider==='demo');
 const source=liveMode?entries():demoRows.length?demoRows:window.createHouseholdLedgerDemo().transactions;
 const future=liveMode||demoRows.length&&demoRows.length===entries().length?
   sharedForecast():window.HouseholdForecastLedger.build(data,source,today(),90,window.HouseholdForecast,Model);
 const payment=window.HouseholdPaymentObligations.build(snapshot,source,future.events,data.predictions);
 const suppressed=new Set(payment.suppressedExpectedIds||[]);
 // A statement-autopay rule owns its card/source/date. Do not leave a prior
 // manually scheduled amount in place on the same day (even if it differs).
 const cardAutopays=payment.plans;
 const manualMovements=(data.predictions.accountMovements||[]).filter(p=>{
  const occurrences=window.HouseholdAccountForecast.occurrences(p,snapshot.asOf,cashDateOffset(snapshot.asOf,90));

function ledgerCategories(){

function categoryMonthRows(month){
 // Both category views use the same reconciled records, calendar month, posted
 // expense filters, forecast engine and user-set caps. Never reclassify bank facts.
 const bounds=budgetBounds(month),asOf=today(),records=entries();
 return ledgerCategories().map(category=>{
  const related=records.filter(t=>t.category===category&&t.date>=bounds.start&&t.date<=bounds.end);
  const byNewest=(a,b)=>b.date.localeCompare(a.date);
  const posted=related.filter(t=>['expense','refund'].includes(t.type)&&!t.pending&&t.date<=asOf&&Number(t.amount)>0).sort(byNewest);
  const pending=related.filter(t=>['expense','refund'].includes(t.type)&&t.pending&&Number(t.amount)>0).sort(byNewest);
  const notSpending=related.filter(t=>data.categoryOverrides?.[t.id]===category&&
   (!['expense','refund'].includes(t.type)||!t.pending&&t.date>asOf)).sort(byNewest);
  const pendingNet=pending.reduce((n,t)=>n+(t.type==='refund'?-Number(t.amount):Number(t.amount)),0);
  return {category,posted,pending,notSpending,pendingNet,
   f:monthlyProjection(month,category),limit:Number(data.predictions.monthlyBudgets[category])||0};
 });
}

/* The Activity recurrence control is a native select, just like Category.
 * Automatic and Not recurring apply on change. Recurring alone opens the
 * additional schedule fields in the same row, without changing source facts.
 */
function bindActivityRecurrenceEdits(){
 document.querySelectorAll('select[data-recurring]').forEach(select=>{
  select.addEventListener('click',e=>e.stopPropagation());
  select.addEventListener('keydown',e=>e.stopPropagation());
  select.addEventListener('keyup',e=>e.stopPropagation());
  select.addEventListener('change',()=>{
   const record=data.transactions.find(t=>String(t.id)===select.dataset.recurring);
   if(!record)return;
   const category=Model.categoryFor(data,record.id);
   const account=String(record.accountId||record.account||'Unknown');
   const key=window.HouseholdForecast.patternKey(record.type,
    record.type==='income'||record.type==='transfer'?'Income':category,account,record.merchant);
   const selected=select.value;
   if(selected==='choose'||selected==='trust')return;
   if(selected==='schedule'||selected==='edit-schedule'){
    beginActivityRecurrenceEdit(select,record,key);
    return;
   }
   try{
    if(selected==='auto')Model.setPatternRule(data,key,null);
    else if(selected==='none')Model.setPatternRule(data,key,{mode:'none'});
    else return;
    finishActivityRecurrenceEdit(record.id);
   }catch(error){alert(error.message);render()}
  });
 });
}

 for(const key of openKeys){

  if(group)group.open=true;
 }
 window.scrollTo({top:scroll,behavior:'instant'});

 const rule=data.predictions.patternRules?.[key];
 const isTransfer=record.type==='transfer';
 const previous=rule?.mode==='none'?'none':rule?.mode==='schedule'||rule?.mode==='monthly'?'schedule':
  rule?.mode==='trust'?'trust':'auto';
 const frequency=rule?.mode==='schedule'?rule.frequency:(select.dataset.frequencyHint||'monthly');
 const day=rule?.day||Number(record.date.slice(8,10));
 const amount=rule?.amount||record.amount;
 const anchorDate=rule?.anchorDate||record.date;
 const freqs=[['monthly','Monthly'],['weekly','Weekly'],['biweekly','Every 2 weeks'],
  ['quarterly','Every 3 months'],['semiannual','Every 6 months'],['annual','Yearly']];
 const form=document.createElement('form');
 form.className='recurring-inline-form';
 form.dataset.recurringForm=String(record.id);
 form.innerHTML='<div class="recurring-schedule-fields">'+
  '<label>Frequency<select name="frequency">'+freqs.map(([v,label])=>
   '<option value="'+v+'" '+(v===frequency?'selected':'')+'>'+label+'</option>').join('')+'</select></label>'+
  '<label class="recurring-day-field">Day of month<input type="number" name="day" min="1" max="31" step="1" required value="'+esc(day)+'"></label>'+
  '<label>Starting date<input type="date" name="anchorDate" required value="'+esc(anchorDate)+'"></label>'+
  '<label>Expected amount ($)<input type="number" name="amount" min=".01" step=".01" required value="'+esc(amount)+'"></label>'+
  '</div>'+(isTransfer?'<label class="recurring-direction-field">Transfer direction'+
   '<select name="cashDirection" required>'+
   '<option value="" '+(!rule?.cashDirection&&!record.cashDirection?'selected':'')+'>Choose direction</option>'+
   '<option value="out" '+((rule?.cashDirection||record.cashDirection)==='out'?'selected':'')+'>Money out of this account</option>'+
   '<option value="in" '+((rule?.cashDirection||record.cashDirection)==='in'?'selected':'')+'>Money into this account</option>'+
   '</select></label>':'')+
  '<small class="recurring-schedule-hint"></small>'+
  '<div class="recurring-inline-actions"><button type="submit" class="btn primary" data-recurring-save>Save schedule</button>'+
  '<button type="button" class="btn" data-recurring-cancel>Cancel</button></div>'+
  '<span class="recurring-error" role="alert"></span>';
 form.addEventListener('click',e=>e.stopPropagation());
 form.addEventListener('pointerdown',e=>e.stopPropagation());
 form.addEventListener('keydown',e=>e.stopPropagation());
 const cell=select.closest('td')||select.closest('.recurring-control-shell');
 cell.classList.add('recurring-editing');
 select.replaceWith(form);
 const frequencyInput=form.querySelector('[name=frequency]'),dayField=form.querySelector('.recurring-day-field');
 const hint=form.querySelector('.recurring-schedule-hint');
 function update(){
  const interval=['weekly','biweekly'].includes(frequencyInput.value);
  dayField.hidden=interval;
  // Keep the hidden day value in FormData: weekly schedules still require a valid stored day.
  hint.textContent=(interval?
   'The starting date determines the weekday. Repeats every 7 or 14 days.':
   'Repeats on this calendar day; short months use their last day.')+
   (isTransfer?' Transfers affect account cash flow, not spending or earned income.':'');
 }
 function cancel(){
  if(form.isConnected){
   select.value=previous;
   // Undetected transactions have a placeholder instead of an automatic label.
   if(select.querySelector('option[value=choose]'))select.value='choose';
   form.replaceWith(select);
  }
  cell.classList.remove('recurring-editing');
  select.focus({preventScroll:true});
 }
 frequencyInput.addEventListener('change',update);
 form.querySelector('[data-recurring-cancel]').addEventListener('click',cancel);
 form.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancel()}});
 form.addEventListener('submit',e=>{
  e.preventDefault();
  try{
   const values=new FormData(form);
   Model.setPatternRule(data,key,{mode:'schedule',
    frequency:values.get('frequency'),day:values.get('day'),anchorDate:values.get('anchorDate'),
    amount:values.get('amount'),...(isTransfer?{cashDirection:values.get('cashDirection')}: {})});
   finishActivityRecurrenceEdit(record.id);
  }catch(error){form.querySelector('.recurring-error').textContent=error.message}
 });
 update();frequencyInput.focus({preventScroll:true});
}
/* Direct-edit forecast values only; recorded bank amounts remain immutable. */
function beginInlineMoneyEdit(button,onSave){
 const prior=Number(button.dataset.amount)||0;
 const host=document.createElement('span');host.className='inline-money-editor';
 const prefix=document.createElement('span');prefix.textContent='$';prefix.setAttribute('aria-hidden','true');
 const input=document.createElement('input');input.type='text';input.inputMode='decimal';
 input.autocomplete='off';input.spellcheck=false;input.className='inline-money-input';
 input.value=prior.toFixed(2);input.maxLength=13;
 input.setAttribute('aria-label',button.getAttribute('aria-label')||'Edit amount');
 host.append(prefix,input);
 for(const name of ['click','pointerdown','mousedown','keydown','keyup'])
  host.addEventListener(name,e=>e.stopPropagation());
 button.replaceWith(host);input.focus();input.select();
 let done=false;
 function close(commit,showError=false){
  if(done)return;
  let amount=prior;
  if(commit){
   const raw=input.value.trim().replace(/,/g,'');
   const valid=/^\d+(?:\.\d{1,2})?$/.test(raw)&&Number.isFinite(Number(raw))&&Number(raw)<=999999999;
   if(!valid){
    if(showError){
     input.setCustomValidity('Enter zero or a positive amount with at most two decimals.');
     input.reportValidity();return;
    }
    commit=false;
   }else amount=Number(raw);
  }
  done=true;host.replaceWith(button);
  if(commit&&amount!==prior){
   try{onSave(amount,button)}catch(err){alert(err.message)}
  }
  if(button.isConnected)button.focus({preventScroll:true});
 }
 input.addEventListener('input',()=>input.setCustomValidity(''));
 input.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();close(false)}
  if(e.key==='Enter'){e.preventDefault();close(true,true)}
 });
 input.addEventListener('blur',()=>close(true,false));
}
function updateBudgetAmountUI(category,amount,button){
 const item=button.closest('.budget-entry');
 const f=monthlyProjection(budgetMonth,category),limit=Number(amount)||0;
 button.dataset.amount=String(limit);
 button.textContent=limit?money(limit):'Set cap';
 const width=limit?Math.min(100,Math.max(0,f.actual/limit*100)):0;
 const expected=limit?Math.min(Math.max(0,100-width),Math.max(0,f.additional/limit*100)):0;
 const bar=item.querySelector('.budget-progress');
 bar.querySelector('.actual').style.width=width.toFixed(2)+'%';
 bar.querySelector('.forecast').style.width=expected.toFixed(2)+'%';
 bar.setAttribute('aria-label',category+': '+money(f.actual)+' spent, '+money(f.additional)+
  ' expected transactions, budget '+(limit?money(limit):'not set'));
 item.querySelector('.budget-heading:last-child .budget-category-meta:last-child')
  ?.classList.toggle('over-budget',Boolean(limit&&budgetMonth===today().slice(0,7)&&f.projectedTotal>limit));
 // Category caps are editable inline; keep the overall cap and bar synchronized immediately.
 const overall=document.querySelector('section[aria-label="Overall monthly budget"]');
 if(overall){
  const cats=[...new Set([...allCategories(),...Object.keys(data.predictions.monthlyBudgets)])];
  const totals=cats.reduce((total,name)=>{
   const projection=monthlyProjection(budgetMonth,name);
   total.actual+=Number(projection.actual)||0;
   total.expected+=Number(projection.additional)||0;
   total.limit+=Number(data.predictions.monthlyBudgets[name])||0;
   return total;
  },{actual:0,expected:0,limit:0});
  const actualWidth=totals.limit?Math.min(100,Math.max(0,totals.actual/totals.limit*100)):0;
  const expectedWidth=totals.limit?Math.min(Math.max(0,100-actualWidth),Math.max(0,totals.expected/totals.limit*100)):0;
  const progress=overall.querySelector('.budget-progress');
  progress.querySelector('.actual').style.width=actualWidth.toFixed(2)+'%';
  progress.querySelector('.forecast').style.width=expectedWidth.toFixed(2)+'%';
  progress.setAttribute('aria-label','Overall budget: '+money(totals.actual)+' spent, '+money(totals.expected)+' expected, total budget '+money(totals.limit));
  const summary=overall.querySelectorAll('.budget-heading .budget-category-meta');
  if(summary[0])summary[0].textContent='Combined budget '+money(totals.limit);
  if(summary[1]){
   summary[1].textContent=budgetMonth===today().slice(0,7)?'Expected total '+money(totals.actual+totals.expected):'Recorded total '+money(totals.actual);
   summary[1].classList.toggle('over-budget',Boolean(totals.limit&&totals.actual+totals.expected>totals.limit));
  }
 }
}
function bindInlineMoneyEdits(){
 document.querySelectorAll('[data-inline-budget]').forEach(button=>{
  button.addEventListener('keydown',e=>e.stopPropagation());
  button.addEventListener('keyup',e=>e.stopPropagation());
  button.addEventListener('click',e=>{
   e.preventDefault();e.stopPropagation();
   const category=button.dataset.inlineBudget;
   beginInlineMoneyEdit(button,(amount,control)=>{
    Model.setMonthlyBudget(data,category,amount);save();
    updateBudgetAmountUI(category,amount,control);
   });
  });
 });
 document.querySelectorAll('[data-inline-expected]').forEach(button=>{
  button.addEventListener('keydown',e=>e.stopPropagation());
  button.addEventListener('keyup',e=>e.stopPropagation());
  button.addEventListener('click',e=>{
   e.preventDefault();e.stopPropagation();
   const id=button.dataset.inlineExpected,category=button.closest('.budget-entry').dataset.budgetCategory;
   beginInlineMoneyEdit(button,amount=>{
    const item=monthlyProjection(budgetMonth,category).expected.find(x=>x.id===id);
    if(!item)throw Error('Expected payment no longer available');
    if(id.startsWith('manual|'))Model.saveManualExpected(data,{...item,amount});
    else Model.updateExpectedTransaction(data,id,{date:item.date,amount,enabled:item.enabled!==false});
    save();refreshCategory(category,id);
   });
  });
 });
}

function projectedCashFlow(){
 const snapshot=window.HouseholdBankFeed.getSnapshot(today()),account=snapshot.accounts[0];
 const history=snapshot.mode==='demo'&&window.createHouseholdLedgerDemo?window.createHouseholdLedgerDemo().transactions:entries();
 const model=window.HouseholdCashFlow.cashFlow90({account,asOf:snapshot.asOf,days:90,transactions:history,
 predictionOverrides:{streams:data.predictions.cashFlowStreams,events:data.predictions.cashFlowEvents,dailyVariable:data.predictions.dailyVariable}});
 return {account,model};
}
function streamPredictionForm(key){
 const {model}=projectedCashFlow(),stream=model.streams.find(s=>s.key===key);if(!stream)return;
 showEditor('<h3>Adjust predicted payment</h3><div class="readonly-transaction">'+esc(stream.merchant)+' · '+esc(stream.type)+'<div class="transaction-source">Prediction only; no bank record modified.</div></div>'+
 '<form id="entry"><div class="formgrid"><label>Expected amount ($)<input name="amount" type="number" min="0" step=".01" required value="'+stream.amount+'"></label>'+
 '<label>Expected day of month<input name="day" type="number" min="1" max="31" step="1" required value="'+stream.day+'"></label></div>'+
 '<label class="toggle-forecast"><input type="checkbox" name="enabled" '+(stream.enabled?'checked':'')+'> Include predicted payment</label>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save prediction</button><button class="btn" type="button" id="reset-prediction">Reset to model</button><button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);Model.setStreamOverride(data,key,{amount:f.get('amount'),day:Number(f.get('day')),enabled:f.has('enabled')});save();render();alertMsg('Predicted payment updated.')}catch(err){alert(err.message)}};
 el('reset-prediction').onclick=()=>{Model.setStreamOverride(data,key,null);save();render();alertMsg('Automatic prediction restored.')};
 bindCancel();
}

 '<p class="prediction-note">Changes only future balances; not posted transactions.</p>'+

 const event=old||{date:today(),type:'expense',amount:'',description:''};
 showEditor('<h3>'+(old?'Edit':'Add')+' projected event</h3><p class="prediction-note">This is a forecast, not a bank transaction.</p>'+

 '<label>Description<input name="description" type="text" maxlength="160" required value="'+esc(event.description)+'"></label></div>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save prediction</button>'+(old?'<button class="btn danger" id="remove-prediction" type="button">Remove prediction</button>':'')+
 '<button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);Model.saveEvent(data,{id,date:f.get('date'),amount:f.get('amount'),type:f.get('type'),description:f.get('description'),accountId:account.id});save();render();alertMsg('Forecast event saved.')}catch(err){alert(err.message)}};

function navigateTo(next){window.scrollTo({top:0,left:0,behavior:'instant'});page=next;render();window.scrollTo({top:0,left:0,behavior:'instant'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigateTo(b.dataset.page));el('period').onchange=e=>{if(page==='budgets'||page==='insights'&&insightMode==='categories'){budgetMonth=e.target.value;period=e.target.value}else{period=e.target.value;if(period!=='all')budgetMonth=period}render()};render();if(window.HouseholdLiveSource)window.HouseholdLiveSource.bind({
 enterReal:(next,snapshot)=>{data=Model.migrate(next);liveMode=true;window.HouseholdBankFeed.setSandboxSnapshot(snapshot);unifiedCache=null},
 enterDemo:()=>{liveMode=false;data=demoData;window.HouseholdBankFeed.setSandboxSnapshot(null);unifiedCache=null},
 render:()=>render()
})})();
