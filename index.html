(()=>{
'use strict';const KEY='household-ledger-v1',CATS=['Groceries','Shopping','Housing','Utilities','Transportation','Dining','Health','Entertainment','Kids & Family','Insurance','Subscriptions','Other'],BANDS=[['Under $10',0,10],['$10–$25',10,25],['$25–$50',25,50],['$50–$100',50,100],['$100–$200',100,200],['$200–$500',200,500],['$500+',500,Infinity]],money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c])),el=x=>document.getElementById(x),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('en-CA');const Model=window.HouseholdLedgerData,initialStorage=localStorage.getItem(KEY);let initial;try{initial=initialStorage?JSON.parse(initialStorage):null}catch{initial=null}
if(!initial)initial=initialStorage===null&&window.createHouseholdLedgerDemo?window.createHouseholdLedgerDemo():{transactions:[],items:[],budgets:{}};
let data=Model.migrate(initial),page='budgets',period=today().slice(0,7),budgetMonth=today().slice(0,7),insightMode='categories';
function save(){localStorage.setItem(KEY,JSON.stringify(data))}save();
function entries(){return Model.records(data)}
function alertMsg(message){el('flash').innerHTML='<div class="message">'+esc(message)+'</div>';window.scrollTo({top:0,behavior:'instant'})}
function cleanMerchant(s){let u=s.toUpperCase();if(u.includes('COSTCO'))return /GAS|FUEL|PUMP/.test(u)?'Costco Gas':'Costco Warehouse';if(/AMAZON|AMZN/.test(u))return 'Amazon';if(u.includes('WALMART')||u.includes('WAL-MART'))return 'Walmart';if(u.includes('SAFEWAY'))return 'Safeway';return s.trim()}function type(s,n){if(/TRANSFER|PAYMENT TO|CARD PAYMENT|AUTOPAY|CREDIT CARD PAYMENT/i.test(s))return 'transfer';if(/PAYROLL|DIRECT DEPOSIT|REFUND|DEPOSIT/i.test(s))return 'income';return n>0?'income':'expense'}function category(s){s=s.toLowerCase();if(/costco gas|shell|chevron|fuel|exxon/.test(s))return'Transportation';if(/costco|safeway|grocery|trader joe|kroger/.test(s))return'Groceries';if(/amazon|walmart|target|ebay|home depot/.test(s))return'Shopping';if(/mortgage|rent/.test(s))return'Housing';if(/water|electric|internet|utility|xfinity|verizon/.test(s))return'Utilities';if(/restaurant|coffee|pizza|cafe/.test(s))return'Dining';return'Other'}function rows(){return entries().filter(t=>period==='all'||t.date.slice(0,7)===period)}function expense(){return rows().filter(t=>t.type==='expense')}function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}function grouped(a,field){const o={};a.forEach(t=>{const k=field==='merchant'?cleanMerchant(t.merchant):t.category;o[k]??={name:k,amount:0,count:0};o[k].amount+=+t.amount;o[k].count++});return Object.values(o).sort((a,b)=>b.amount-a.amount)}function recurringInsights(tabs){
  const model=window.HouseholdRecurring;
  if(!model)return tabs+'<div class="panel">Recurring analysis is unavailable.</div>';
  // Detect from all local history; the Insights month filter only limits displayed source transactions.
  const report=model.analyze(entries(),today());
  const currentOnly=period!=='all';
  function listRecurring(items,needsReview=false){
    if(!items.length)return'<div class="recurring-empty">'+(needsReview?'No subscriptions currently need review.':'No repeating payments detected yet.')+'</div>';
    return items.map(g=>{
      const visible=g.transactions.filter(t=>!currentOnly||t.date.startsWith(period)).slice().sort((x,y)=>y.date.localeCompare(x.date));
      const next=g.nextExpected?cashDateLabel(g.nextExpected,true):null;
      const amount=needsReview?money(g.amount)+' last charge':money(g.monthlyEstimate)+' / mo';
      const meta=needsReview?'Unconfirmed • '+g.count+' recorded charge'+(g.count===1?'':'s'):
        g.cadence+' • '+money(g.amount)+' per charge'+(next?' • Next est. '+next:'');
      return'<details class="drill-detail recurring-detail"><summary class="row drill-summary"><div class="recurring-info"><strong>'+esc(g.merchant)+'</strong><div class="recurring-meta">'+esc(meta)+'</div></div><div class="recurring-amount"><strong>'+amount+'</strong><div class="recurring-meta">'+(needsReview?esc(g.status):'Estimated monthly cost')+'</div></div><span class="chevron" aria-hidden="true">⌄</span></summary><div class="drill-expanded"><div class="recurring-detail-note">'+(needsReview?'One or more charges were found, but there is not enough consistent, recent history to estimate a schedule.':'Detected from '+g.count+' similar charges; expected dates and amounts are estimates, not confirmed bills.')+(currentOnly?' Showing source transactions for '+esc(period)+'.':'')+'</div>'+
      (visible.length?table(visible):'<div class="empty">No charges in the selected month. Select All dates to see the full history.</div>')+
      '</div></details>';
    }).join('');
  }
  return tabs+'<div class="stats recurring-stats">'+
    [['Subscriptions / month',report.subscriptionMonthly,report.subscriptions.length+' detected'],['Recurring bills / month',report.billsMonthly,report.bills.length+' detected'],['Combined / month',report.monthlyTotal,report.confirmed.length+' repeating expenses']].map(([label,value,meta])=>'<div class="stat"><div class="sub">'+label+'</div><div class="num">'+money(value)+'</div><div class="sub">'+meta+'</div></div>').join('')+
    '</div>'+
    '<div class="panel recurring-panel"><div class="section-top"><h3>Subscriptions</h3><span class="budget-summary-meta">'+report.subscriptions.length+' detected</span></div>'+listRecurring(report.subscriptions)+'</div>'+
    '<div class="panel recurring-panel"><div class="section-top"><h3>Recurring bills</h3><span class="budget-summary-meta">'+report.bills.length+' detected</span></div>'+listRecurring(report.bills)+'</div>'+
    (report.review.length?'<div class="panel recurring-panel"><div class="section-top"><h3>Subscriptions to review</h3><span class="budget-summary-meta">'+report.review.length+' uncertain</span></div>'+listRecurring(report.review,true)+'</div>':'')+
    '<div class="recurring-disclaimer">Estimates from local history; not bank-verified. One-off charges are excluded.</div>';
}
function gridStats(){const a=expense(),income=sum(rows().filter(x=>x.type==='income'));return'<div class="stats">'+[['Spent',money(sum(a))],['Income',money(income)],['Net cash flow',money(income-sum(a))]].map(x=>'<div class="stat"><div class="sub">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join('')+'</div>'}function list(a,max=999,kind=null,source=expense()){const top=Math.max(1,...a.map(x=>x.amount));return a.slice(0,max).map(x=>{const matching=kind?source.filter(t=>kind==='merchant'?cleanMerchant(t.merchant)===x.name:t.category===x.name).sort((a,b)=>b.date.localeCompare(a.date)):[];const line='<div style="flex:1;min-width:0"><b>'+esc(x.name)+'</b><div class="bar"><i style="width:'+(x.amount/top*100).toFixed(1)+'%"></i></div></div><div style="text-align:right"><strong>'+money(x.amount)+'</strong><div class="sub">'+x.count+' purchases</div></div>';if(!kind)return'<div class="row">'+line+'</div>';return'<details class="drill-detail"><summary class="row drill-summary">'+line+'<span class="chevron" aria-hidden="true">⌄</span></summary><div class="drill-expanded"><div class="sub">'+matching.length+' transactions • '+money(x.amount)+' total</div>'+table(matching)+'</div></details>'}).join('')||'<div class="empty">No data yet. Import a bank CSV or add a transaction.</div>'}function table(a){return'<div class="ledger-table-wrap"><table class="ledger-table"><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>'+a.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.merchant)+'<div class="transaction-source">'+esc(t.source?.provider==='plaid'?'Bank synced':t.source?.provider==='demo'?'Demo record':'Unverified legacy record')+'</div></td><td>'+esc(t.category)+'</td><td>'+esc(t.type)+'</td><td><strong>'+money(t.amount)+'</strong></td><td><button class="btn" data-category="'+esc(t.id)+'">Category</button></td></tr>').join('')+'</tbody></table></div>'}
function cashDateLabel(iso,year=false){return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',...(year?{year:'numeric'}:{})})}
function cashChart(series,lowestDate){
  const mobile=window.matchMedia('(max-width:700px)').matches;
  const w=mobile?560:960,h=mobile?260:248,l=mobile?112:98,r=mobile?18:28,t=24,b=mobile?48:42,values=series.map(p=>p.balance);
  let min=Math.min(...values),max=Math.max(...values),pad=Math.max(250,(max-min)*.12);min-=pad;max+=pad;
  const x=i=>l+i/Math.max(1,series.length-1)*(w-l-r);
  const y=n=>t+(max-n)/(max-min)*(h-t-b);
  const pts=series.map((p,i)=>x(i).toFixed(1)+','+y(p.balance).toFixed(1)).join(' ');
  const lowIndex=series.findIndex(p=>p.date===lowestDate),low=series[lowIndex],grid=[0,.25,.5,.75,1].map(frac=>{const val=max-frac*(max-min),py=y(val);return '<line x1="'+l+'" y1="'+py.toFixed(1)+'" x2="'+(w-r)+'" y2="'+py.toFixed(1)+'" stroke="#e0e9ed" stroke-dasharray="4 5"/><text x="'+(l-9)+'" y="'+(py+4).toFixed(1)+'" font-size="'+(mobile?22:17)+'" fill="#54616e" text-anchor="end">'+esc(money(val))+'</text>'}).join('');
  const labels=(mobile?[0,45,90]:[0,30,60,90]).map(i=>{if(i>=series.length)return'';return '<text x="'+x(i).toFixed(1)+'" y="'+(h-9)+'" fill="#54616e" text-anchor="middle" font-size="'+(mobile?22:18)+'">'+esc(cashDateLabel(series[i].date))+'</text>'}).join('');
  const zero=min<0&&max>0?'<line x1="'+l+'" y1="'+y(0)+'" x2="'+(w-r)+'" y2="'+y(0)+'" stroke="#c75a55" stroke-dasharray="6 4"/>':'';
  return '<svg class="cash-chart" role="img" aria-label="Daily forecast of bank balance for 90 days. Lowest '+esc(money(low.balance))+' on '+esc(cashDateLabel(low.date,true))+ '." viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+grid+zero+'<polyline points="'+pts+'" fill="none" stroke="#526d63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+x(lowIndex).toFixed(1)+'" cy="'+y(low.balance).toFixed(1)+'" r="6" fill="#b48c56" stroke="#fff" stroke-width="2"/><circle cx="'+x(0)+'" cy="'+y(series[0].balance).toFixed(1)+'" r="4" fill="#526d63"/>'+labels+'</svg>';
}
function cashFlowCard(){
  const bank=window.HouseholdBankFeed,engine=window.HouseholdCashFlow;
  if(!bank||!engine)return'<div class="cash-panel cash-error">Bank forecasting is temporarily unavailable.</div>';
  const snapshot=bank.getSnapshot(today()),account=snapshot.accounts[0];
  if(!account)return'<div class="cash-panel cash-error">No bank account snapshots are available.</div>';
  // Demo bank amounts and transactions are exclusively fictional; never blend with private browser transactions.
  const transactions=snapshot.mode==='demo'&&window.createHouseholdLedgerDemo?window.createHouseholdLedgerDemo().transactions:entries();
  const f=engine.cashFlow90({account,asOf:snapshot.asOf,days:90,transactions,source:snapshot.source,predictionOverrides:{streams:data.predictions.cashFlowStreams,events:data.predictions.cashFlowEvents,dailyVariable:data.predictions.dailyVariable}});
  const metric=(name,value,meta,extra)=>'<div class="cash-metric '+(extra||'')+'"><div class="sub">'+esc(name)+'</div><div class="num">'+esc(money(value))+'</div><div class="sub">'+esc(meta)+'</div></div>';
  const days=f.series.slice(1);
  const rows=days.map(p=>'<tr><td><details class="cash-day-detail"><summary>'+esc(cashDateLabel(p.date,true))+'</summary><div class="cash-events">'+p.events.map(e=>'<div class="cash-event">'+esc(e.merchant)+' — '+esc(e.description)+': '+esc(money(e.amount))+'</div>').join('')+'</div></details></td><td>'+money(p.income)+'</td><td>'+money(p.outflow)+'</td><td><strong>'+money(p.balance)+'</strong></td></tr>').join('');
  const recurring=f.streams.map(v=>'<tr><td>'+esc(v.merchant)+'</td><td>'+esc(v.type)+'</td><td>Day '+v.day+'</td><td>'+money(v.amount)+'</td></tr>').join('');
  const predictedStreams=f.streams.map(v=>'<div class="row forecast-row"><span>'+esc(v.merchant)+' <small>· '+esc(v.type)+' · day '+v.day+(v.enabled?'':' · skipped')+'</small></span><strong>'+money(v.amount)+'</strong><button class="btn" data-stream="'+esc(v.key)+'">Adjust</button></div>').join('');
  const predictedEvents=data.predictions.cashFlowEvents.filter(e=>!e.accountId||e.accountId===account.id).map(e=>'<div class="row forecast-row"><span>'+esc(e.description)+' <small>· '+esc(e.date)+' · '+esc(e.type)+'</small></span><strong>'+money(e.amount)+'</strong><button class="btn" data-event="'+esc(e.id)+'">Adjust</button></div>').join('');
  const forecastControls='<details class="cash-detail forecast-editor"><summary>Edit predictions · not bank records</summary><div class="section-top"><h3>Daily spending · '+money(f.dailyVariable)+'/day</h3><button class="btn" data-daily-prediction="1">Adjust</button></div>'+
    '<div class="section-top"><h3>Recurring predicted payments</h3></div>'+predictedStreams+
    '<div class="section-top"><h3>One-time projected events</h3><button class="btn" data-add-event="1">Add prediction</button></div>'+
    (predictedEvents||'<div class="empty">No additional forecast events.</div>')+
    '<p class="prediction-note">Changes here affect forecasts only, never bank transactions or available balance.</p></details>';
  return'<div class="cash-panel" id="cashflow"><div class="cash-head"><div><h3>Lowest projected balance · next 90 days</h3><div class="cash-sub">'+esc(account.name)+' · '+esc(f.balanceBasis)+' balance</div></div><span class="cash-demo">SIMULATED BANK DATA</span></div>'+
  '<div class="cash-hero"><div><div class="cash-primary-amount">'+money(f.minimum)+'</div><div class="cash-primary-date">Lowest on '+esc(cashDateLabel(f.lowestDate,true))+'</div></div>'+
  '<div class="cash-secondary"><div><span class="sub">Available now</span><strong>'+money(f.opening)+'</strong></div><div><span class="sub">In 90 days</span><strong>'+money(f.closing)+'</strong></div></div></div>'+
  cashChart(f.series,f.lowestDate)+forecastControls+
  '<div class="cash-status">Estimated from '+esc(f.historyMonths.length)+' months of sample activity. Future bills and deposits may differ.</div>'+
  '<details class="cash-detail"><summary>Explore 90-day cash flow</summary><div class="cash-table-wrap cash-days-wrap"><table class="cash-table daily-cash-table"><thead><tr><th>Date / expected items</th><th>Income</th><th>Outflow</th><th>End-of-day balance</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<details class="cash-detail"><summary>Prediction assumptions</summary><p class="sub">'+esc(f.method)+'. Historical months: '+(f.historyMonths.length?esc(f.historyMonths.join(', ')):'none')+'. Estimated everyday spending: '+money(f.dailyVariable)+'/day.</p>'+
  '<div class="cash-table-wrap"><table class="cash-table"><thead><tr><th>Expected item</th><th>Type</th><th>Estimated day</th><th>Amount</th></tr></thead><tbody>'+recurring+'</tbody></table></div>'+
  '<p class="cash-explain">Fictional bank balance and transactions only. No Plaid connection yet. These are estimated end-of-day balances, not an overdraft guarantee.</p></details></details></div>';
}

function monthlyProjection(month,category){
 const modeled=window.HouseholdForecast.forecast(entries(),month,category,today());
 const expected=Model.expectedForCategory(data,modeled.expected,month,category,today());
 const active=month===today().slice(0,7)?expected.filter(e=>e.enabled!==false&&e.date>today()&&e.date.startsWith(month)):[];
 const additional=Math.round(active.reduce((t,e)=>t+Number(e.amount||0),0)*100)/100;
 return {...modeled,expected,active,additional,recurring:additional,variable:0,projectedTotal:Math.round((modeled.actual+additional)*100)/100};
}
function expectedTransactionMarkup(e){
 const active=e.enabled!==false&&e.date>today()&&e.date.startsWith(budgetMonth);
 const manual=e.source==='manual';
 return '<details class="expected-tx" data-expected="'+esc(e.id)+'"><summary class="expected-summary">'+
  '<span class="expected-date">'+esc(cashDateLabel(e.date))+'</span>'+
  '<span class="expected-info"><strong>'+esc(e.merchant)+'</strong><small>'+esc(manual?'Added prediction':(e.evidence+' historical months · '+e.confidence+' confidence'))+(e.adjusted?' · Adjusted':'')+(e.enabled===false?' · Excluded':e.date<=today()?' · Past due':'')+'</small></span>'+
  '<strong class="expected-value '+(active?'':'excluded')+'">'+money(e.amount)+'</strong><span class="expected-action">Edit</span></summary>'+
  '<form class="expected-inline-form" data-expected-form="'+esc(e.id)+'"><p class="prediction-note">Prediction only. This does not change a bank transaction.</p>'+
  (manual?'<label>Merchant<input type="text" name="merchant" maxlength="130" required value="'+esc(e.merchant)+'"></label>':'')+
  '<label>Expected date<input type="date" name="date" required value="'+esc(e.date)+'"></label>'+

  '<button type="button" class="btn" data-expected-reset="'+esc(e.id)+'">'+(manual?'Remove prediction':'Use history estimate')+'</button></div></form></details>';
}
function predictedCategoryMarkup(f,category,month){
 if(month!==today().slice(0,7))return'';
 return '<div class="expected-section"><div class="section-top"><h3>Expected transactions <span class="expected-count">'+f.active.length+' active</span></h3><strong class="expected-total">'+money(f.additional)+'</strong></div>'+
  (f.expected.length?f.expected.map(expectedTransactionMarkup).join(''):'<div class="empty">No reliable future transactions detected for this category.</div>')+

function refreshCategory(category){

 if(item){const d=item.querySelector(':scope > details');if(d)d.open=true}

function budgetBounds(month){const [year,monthNum]=month.split('-').map(Number),endDay=new Date(year,monthNum,0).getDate(),start=month+'-01',end=month+'-'+String(endDay).padStart(2,'0');const label=new Date(year,monthNum-1,1).toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+new Date(year,monthNum-1,endDay).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});return {start,end,label}}function render(){const demoCount=data.transactions.filter(t=>t.source?.provider==='demo').length;el('demo-banner').innerHTML=demoCount?'<div class="demo-banner"><strong>DEMO</strong></div>':'';const title=page.charAt(0).toUpperCase()+page.slice(1);el('title').textContent=title;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let months=[...new Set([...entries().map(t=>String(t.date).slice(0,7)),today().slice(0,7),...(period==='all'?[]:[period])].filter(m=>/^\d{4}-\d{2}$/.test(m)&&+m.slice(5,7)>=1&&+m.slice(5,7)<=12))].sort().reverse();
if(page==='budgets'){
  const now=new Date(),recent=Array.from({length:12},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-i,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')});
  const choices=[...new Set([...months,...recent,budgetMonth])].sort().reverse();
  const bounds=budgetBounds(budgetMonth);
  el('period').innerHTML=choices.map(m=>'<option value="'+m+'" '+(budgetMonth===m?'selected':'')+'>'+new Date(Number(m.slice(0,4)),Number(m.slice(5,7))-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</option>').join('');
  el('period').setAttribute('aria-label','Budget month');
  el('budget-range').hidden=false;
  el('budget-range').textContent=bounds.label;
  el('subtitle').textContent='What you have, what you will spend, and what remains.';
}else{
  el('period').innerHTML='<option value="all" '+(period==='all'?'selected':'')+'>All dates</option>'+months.map(m=>'<option value="'+m+'" '+(period===m?'selected':'')+'>'+new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</option>').join('');
  el('period').setAttribute('aria-label','Transaction date filter');
  el('budget-range').hidden=true;
  el('subtitle').textContent=page==='transactions'?'All of your entries in one place.':page==='insights'?'See where your money actually goes.':'Data and account preferences.';
}
let a=expense(),html='';if(page==='transactions')html='<div class="panel"><div class="section-top"><h3>Transactions</h3><span class="budget-summary-meta">'+rows().length+' entries</span></div>'+table(rows().sort((a,b)=>b.date.localeCompare(a.date)))+'</div>';
if(page==='insights'){
  const tabs='<div class="insight-tabs" role="tablist" aria-label="Insight views">'+[['categories','Categories'],['merchants','Merchants'],['bands','Purchase sizes'],['recurring','Recurring']].map(([key,name])=>'<button type="button" role="tab" aria-selected="'+(insightMode===key)+'" class="'+(insightMode===key?'active':'')+'" data-insight="'+key+'">'+name+'</button>').join('')+'</div>';
  if(insightMode==='categories'){
    html=tabs+gridStats()+'<div class="panel"><div class="section-top"><h3>Spending by category</h3></div>'+list(grouped(a,'category'),999,'category',a)+'</div>';
  }else if(insightMode==='merchants'){
    html=tabs+gridStats()+'<div class="panel"><div class="section-top"><h3>Merchant totals</h3></div>'+list(grouped(a,'merchant'),999,'merchant',a)+'</div>';
  }else if(insightMode==='recurring'){
    html=recurringInsights(tabs);
  }else{
    const purchases=a.flatMap(t=>{const linked=data.items.filter(i=>i.transactionId===t.id),parts=linked.length?linked:[t];return parts.map(i=>({transactionId:t.id,date:t.date,merchant:cleanMerchant(t.merchant),category:t.category,description:linked.length?String(i.description||i.name||i.title||'Itemized purchase'):'Entire transaction (not itemized)',amount:Number(i.amount),transactionTotal:Number(t.amount),itemized:linked.length>0}))}).filter(i=>Number.isFinite(i.amount));
    const counts=BANDS.map(([name,min,max],index)=>({name,min,max,index,count:0,amount:0,details:[]}));
    purchases.forEach(p=>{const band=counts.find(x=>p.amount>=x.min&&p.amount<x.max);if(band){band.count++;band.amount+=p.amount;band.details.push(p)}});
    html=tabs+gridStats()+'<div class="panel"><div class="section-top"><h3>Individual purchase price bands</h3><span class="budget-summary-meta">Item-level where available</span></div>'+
    counts.map(b=>{
      const d=b.details.slice().sort((x,y)=>y.date.localeCompare(x.date)||x.merchant.localeCompare(y.merchant));
      return '<details class="band-detail"><summary class="band-row"><span>'+esc(b.name)+'</span><span class="band-amount"><strong>'+money(b.amount)+'</strong><span class="sub">'+b.count+' purchases / items</span></span><span class="chevron" aria-hidden="true">⌄</span></summary><div class="band-expanded"><div class="sub band-subheading">'+b.count+' purchases totaling '+money(b.amount)+'</div>'+
      (d.length?'<div class="purchase-table-wrap"><table class="details-table"><thead><tr><th>Date</th><th>Merchant</th><th>Purchase / item</th><th>Category</th><th>Purchase price</th><th>Transaction total</th><th></th></tr></thead><tbody>'+
      d.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.merchant)+'</td><td>'+esc(p.description)+(p.itemized?' <span class="pill">Itemized</span>':'')+'</td><td>'+esc(p.category)+'</td><td><strong>'+money(p.amount)+'</strong></td><td>'+money(p.transactionTotal)+'</td><td><button type="button" class="btn" data-category="'+esc(p.transactionId)+'">Category</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No purchases in this price band.</div>')+'</div></details>'}).join('')+
    '<p class="budget-date-note">Full transactions are counted once when no item-level details are available.</p></div>';
  }
}if(page==='budgets'){
 const cats=[...new Set([...CATS,...Object.keys(data.predictions.monthlyBudgets)])],month=budgetMonth,
 {start:monthStart,end:monthEnd,label:budgetDates}=budgetBounds(month),currentMonth=month===today().slice(0,7);
 html=cashFlowCard()+'<div class="panel"><div class="section-top"><h3>Monthly budgets</h3><span class="budget-summary-meta">'+esc(budgetDates)+'</span></div>'+
 '<div class="budget-legend"><span>Spent</span><span>Expected</span></div>'+
 cats.map(category=>{
  const matching=entries().filter(t=>t.type==='expense'&&t.category===category&&t.date>=monthStart&&t.date<=monthEnd).sort((a,b)=>b.date.localeCompare(a.date));
  const f=monthlyProjection(month,category),limit=Number(data.predictions.monthlyBudgets[category])||0;
  const spentWidth=limit?Math.min(100,Math.max(0,f.actual/limit*100)):0;
  const forecastWidth=limit?Math.min(Math.max(0,100-spentWidth),Math.max(0,f.additional/limit*100)):0;
  return'<div class="budget-entry" data-budget-category="'+esc(category)+'"><details class="drill-detail"><summary class="row drill-summary"><div style="flex:1;min-width:0">'+
  '<div class="budget-heading"><span class="budget-title">'+esc(category)+'</span><span class="budget-summary-amount">'+money(f.actual)+'</span></div>'+
  '<div class="budget-progress" role="img" aria-label="'+esc(category)+': '+esc(money(f.actual))+' spent, '+esc(money(f.additional))+' expected transactions, budget '+esc(limit?money(limit):'not set')+'">'+
  '<i class="actual" style="width:'+spentWidth.toFixed(2)+'%"></i><i class="forecast" style="width:'+forecastWidth.toFixed(2)+'%"></i></div>'+
  '<div class="budget-heading"><span class="budget-category-meta">'+(limit?'Budget '+money(limit):'No budget set')+'</span>'+
  '<span class="budget-category-meta '+(limit&&currentMonth&&f.projectedTotal>limit?'over-budget':'')+'">'+
  (currentMonth?'Expected '+money(f.projectedTotal):'Completed month')+'</span></div></div><span class="chevron" aria-hidden="true">⌄</span></summary>'+
  '<div class="drill-expanded"><div class="section-top"><h3>'+esc(category)+' · '+esc(month)+'</h3><button class="btn" data-budget="'+esc(category)+'">Edit budget target</button></div>'+
  predictedCategoryMarkup(f,category,month)+
  '<div class="recorded-section"><div class="section-top"><h3>Recorded transactions</h3><strong>'+money(f.actual)+'</strong></div>'+
  (matching.length?table(matching):'<div class="empty">No posted expenses in this category for the selected month.</div>')+'</div>'+
  (currentMonth?'<p class="prediction-note">Automatic predictions based on '+f.historyMonths.length+' historical months; never guaranteed. Monthly category expected amount = sum of active dated predictions.</p>':'')+
  '</div></details></div>';
 }).join('')+'</div>';
}
if(page==='settings'){
 const sources=data.transactions.reduce((counts,t)=>{const p=t.source?.provider||'legacy-unverified';counts[p]=(counts[p]||0)+1;return counts},{});
 html='<div class="settings-grid"><div class="panel settings-block"><h3>Read-only ledger</h3><p>Transaction facts are provided by source records. Only categories and predictions are editable.</p>'+
 Object.entries(sources).map(([provider,n])=>'<div class="row"><span>'+esc(provider==='plaid'?'Plaid connected':provider==='demo'?'Fictional demo data':'Unverified legacy records')+'</span><strong>'+n+'</strong></div>').join('')+
 '<p>Plaid connection is not yet enabled. Do not enter bank credentials on this static site.</p><button class="btn" id="backup">Export local snapshot</button></div>'+
 '<div class="panel settings-block"><h3>Your adjustments</h3><p>Change transaction categories without rewriting source data, or adjust monthly budgets and future payment predictions.</p><p>Amounts, dates, merchants, and bank balances cannot be edited in the ledger. Direct transaction imports and restores are disabled.</p></div></div>';
}
el('view').innerHTML=html;
document.querySelectorAll('[data-insight]').forEach(b=>b.onclick=()=>{insightMode=b.dataset.insight;render()});
if(page==='insights'&&window.matchMedia('(max-width:700px)').matches){
 const tabs=document.querySelector('.insight-tabs'),active=tabs?.querySelector('.active');
 if(tabs&&active)tabs.scrollLeft+=active.getBoundingClientRect().left-tabs.getBoundingClientRect().left-16;
}
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>categoryForm(b.dataset.category));
document.querySelectorAll('[data-budget]').forEach(b=>b.onclick=()=>budgetPredictionForm(b.dataset.budget,budgetMonth));
document.querySelectorAll('[data-stream]').forEach(b=>b.onclick=()=>streamPredictionForm(b.dataset.stream));
document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>eventPredictionForm(b.dataset.event));
document.querySelectorAll('[data-add-event]').forEach(b=>b.onclick=()=>eventPredictionForm(null));
document.querySelectorAll('[data-daily-prediction]').forEach(b=>b.onclick=()=>dailyPredictionForm());
if(page==='settings')el('backup').onclick=()=>download(JSON.stringify(data,null,2),'household-ledger-backup.json','application/json');
}
function download(s,name,mime){let u=URL.createObjectURL(new Blob([s],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function showEditor(content){
 el('flash').innerHTML='<div class="panel editable-forecast">'+content+'</div>';
 window.scrollTo({top:0,left:0,behavior:'instant'});
}
function bindCancel(){el('cancel').onclick=()=>el('flash').innerHTML=''}
function categoryForm(id){
 const record=data.transactions.find(t=>t.id===id);if(!record)return;
 const current=Model.categoryFor(data,id);
 const options=CATS.map(c=>'<option value="'+esc(c)+'" '+(c===current?'selected':'')+'>'+esc(c)+'</option>').join('');
 showEditor('<h3>Change category</h3><div class="readonly-transaction"><strong>'+esc(record.merchant)+'</strong> · '+money(record.amount)+' · '+esc(record.date)+'<div class="transaction-source">Source transaction is read-only.</div></div>'+
 '<form id="entry"><label>Category<select name="category">'+options+'</select></label><div class="editor-actions"><button class="btn primary" type="submit">Save category</button><button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{Model.setCategory(data,id,new FormData(e.target).get('category'));save();render();alertMsg('Category updated. Source record unchanged.')}catch(err){alert(err.message)}};
 bindCancel();
}
function budgetPredictionForm(category,month){
 const base=window.HouseholdForecast.forecast(entries(),month,category,today()),override=data.predictions.categoryForecasts[month+'|'+category];
 const budget=data.predictions.monthlyBudgets[category]||0;
 showEditor('<h3>Predictions · '+esc(category)+'</h3><div class="readonly-transaction">Recorded spending <strong>'+money(base.actual)+'</strong> (read-only)</div>'+
 '<form id="entry"><div class="formgrid"><label>Monthly budget target ($)<input name="budget" type="number" min="0" step=".01" required value="'+esc(budget)+'"></label>'+
 '<label>Additional expected spending ($)<input name="additional" type="number" min="0" step=".01" required value="'+esc(override?override.additional:base.additional)+'"></label></div>'+
 '<p class="prediction-note">Automatic estimate: '+money(base.additional)+'. Overrides only the pink forecast, not recorded spending.</p>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save predictions</button><button class="btn" type="button" id="reset-forecast">Use automatic estimate</button><button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);Model.setMonthlyBudget(data,category,f.get('budget'));Model.setCategoryForecast(data,month,category,f.get('additional'));save();render();alertMsg('Predictions saved. Actuals unchanged.')}catch(err){alert(err.message)}};
 el('reset-forecast').onclick=()=>{Model.setCategoryForecast(data,month,category,null);save();render();alertMsg('Automatic forecast restored.')};
 bindCancel();
}
function projectedCashFlow(){
 const snapshot=window.HouseholdBankFeed.getSnapshot(today()),account=snapshot.accounts[0];
 const history=snapshot.mode==='demo'&&window.createHouseholdLedgerDemo?window.createHouseholdLedgerDemo().transactions:entries();
 const model=window.HouseholdCashFlow.cashFlow90({account,asOf:snapshot.asOf,days:90,transactions:history,
 predictionOverrides:{streams:data.predictions.cashFlowStreams,events:data.predictions.cashFlowEvents,dailyVariable:data.predictions.dailyVariable}});
 return {account,model};
}
function streamPredictionForm(key){
 const {model}=projectedCashFlow(),stream=model.streams.find(s=>s.key===key);if(!stream)return;
 showEditor('<h3>Adjust predicted payment</h3><div class="readonly-transaction">'+esc(stream.merchant)+' · '+esc(stream.type)+'<div class="transaction-source">Prediction only; no bank record modified.</div></div>'+
 '<form id="entry"><div class="formgrid"><label>Expected amount ($)<input name="amount" type="number" min="0" step=".01" required value="'+stream.amount+'"></label>'+
 '<label>Expected day of month<input name="day" type="number" min="1" max="31" step="1" required value="'+stream.day+'"></label></div>'+
 '<label class="toggle-forecast"><input type="checkbox" name="enabled" '+(stream.enabled?'checked':'')+'> Include predicted payment</label>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save prediction</button><button class="btn" type="button" id="reset-prediction">Reset to model</button><button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);Model.setStreamOverride(data,key,{amount:f.get('amount'),day:Number(f.get('day')),enabled:f.has('enabled')});save();render();alertMsg('Predicted payment updated.')}catch(err){alert(err.message)}};
 el('reset-prediction').onclick=()=>{Model.setStreamOverride(data,key,null);save();render();alertMsg('Automatic prediction restored.')};
 bindCancel();
}
function dailyPredictionForm(){
 const {model}=projectedCashFlow();
 showEditor('<h3>Expected daily spending</h3><form id="entry"><label>Predicted variable spending ($ per day)<input name="amount" type="number" min="0" step=".01" required value="'+esc(data.predictions.dailyVariable??model.dailyVariable)+'"></label>'+
 '<p class="prediction-note">Changes only future balances; not posted transactions.</p>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save prediction</button><button class="btn" type="button" id="reset-prediction">Use automatic estimate</button><button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{Model.setDailyVariable(data,new FormData(e.target).get('amount'));save();render();alertMsg('Daily forecast updated.')}catch(err){alert(err.message)}};
 el('reset-prediction').onclick=()=>{Model.setDailyVariable(data,null);save();render();alertMsg('Automatic estimate restored.')};
 bindCancel();
}
function eventPredictionForm(id){
 const {account}=projectedCashFlow(),old=data.predictions.cashFlowEvents.find(e=>e.id===id);
 const event=old||{date:today(),type:'expense',amount:'',description:''};
 showEditor('<h3>'+(old?'Edit':'Add')+' projected event</h3><p class="prediction-note">This is a forecast, not a bank transaction.</p>'+
 '<form id="entry"><div class="formgrid"><label>Expected date<input name="date" type="date" required value="'+esc(event.date)+'"></label>'+
 '<label>Amount ($)<input name="amount" type="number" min=".01" step=".01" required value="'+esc(event.amount)+'"></label>'+
 '<label>Direction<select name="type"><option value="expense" '+(event.type==='expense'?'selected':'')+'>Money out</option><option value="income" '+(event.type==='income'?'selected':'')+'>Money in</option></select></label>'+
 '<label>Description<input name="description" type="text" maxlength="160" required value="'+esc(event.description)+'"></label></div>'+
 '<div class="editor-actions"><button class="btn primary" type="submit">Save prediction</button>'+(old?'<button class="btn danger" id="remove-prediction" type="button">Remove prediction</button>':'')+
 '<button class="btn" type="button" id="cancel">Cancel</button></div></form>');
 el('entry').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);Model.saveEvent(data,{id,date:f.get('date'),amount:f.get('amount'),type:f.get('type'),description:f.get('description'),accountId:account.id});save();render();alertMsg('Forecast event saved.')}catch(err){alert(err.message)}};
 if(old)el('remove-prediction').onclick=()=>{Model.removeEvent(data,id);save();render();alertMsg('Prediction removed. Ledger unchanged.')};
 bindCancel();
}
function navigateTo(next){window.scrollTo({top:0,left:0,behavior:'instant'});page=next;render();window.scrollTo({top:0,left:0,behavior:'instant'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigateTo(b.dataset.page));el('period').onchange=e=>{if(page==='budgets'){budgetMonth=e.target.value;period=e.target.value}else{period=e.target.value;if(period!=='all')budgetMonth=period}render()};render()})();
</script></body></html>
