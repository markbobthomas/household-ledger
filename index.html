<main class="shell"><div class="content">
  <header class="topbar">
    <div>
      <h1>Ledger</h1>
    </div>
    <div class="top-actions">
    <button type="button" class="attention-link" data-view="reviews" aria-label="Open things to check"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg><span class="attention-label">Things to check</span><span class="attention-short" aria-hidden="true">Check</span><span class="review-tab-count" data-review-tab-count hidden></span></button>

          <button type="button" data-view="trend">Balance Trend</button>
          <button type="button" data-view="settings">Settings</button>
          <div class="planner-menu-bank">
            <label for="ledger-mode-switch">Data source</label>
            <select id="ledger-mode-switch" class="mode-box" aria-label="Bank data source"><option value="demo">Demo</option><option value="real">Real / Plaid</option></select>
            <span class="status-tag" id="source-type" aria-live="polite">DEMO DATA</span>
            <button class="btn" type="button" id="refresh-bank" hidden>Refresh bank</button>
            <a class="btn" id="bank-connect" href="/bank-connect" hidden>Bank connections</a>
          </div>
          <button class="btn primary" type="button" id="audit-launch" data-run-backtest hidden>Check accuracy</button>
          <small id="deployment-version">Focused Review v1 · Server not verified</small>
        </div>
      </details>
    </div>
  </header>
  <div class="main-navigation">
    <nav class="planner-tabs planner-nav-primary" aria-label="Main navigation">
      <button type="button" class="tab-link active" data-view="summary" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg><span>Home</span></button>
      <button type="button" class="tab-link" data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg><span>Spending</span></button>
      <button type="button" class="tab-link" data-view="schedules"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8m-8 5h8"/></svg><span>Bills</span></button>
      <button type="button" class="tab-link" data-view="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h15M6 12h15M6 19h15M2 5h.01M2 12h.01M2 19h.01"/></svg><span>Activity</span></button>
    </nav>
  </div>
  <div id="planner-notice" aria-live="polite"></div>
  <div id="planner-main" aria-live="polite"><div class="panel">Preparing your balance plan…</div></div>
  <footer id="planner-fine-print" class="planner-fine-print" hidden></footer>
