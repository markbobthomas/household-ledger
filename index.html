<style>
/* A tab click is visible even while a fresh set of views is rebuilding. */
#planner-main{position:relative}
.ledger-page-wait{position:absolute;inset:0;z-index:5;min-height:220px;background:#fff;
 display:flex;justify-content:center;align-items:flex-start;padding-top:72px;gap:12px;color:#344b43;font-weight:650}
.ledger-page-wait:before{content:"";width:20px;height:20px;border-radius:50%;
 border:3px solid #dce7df;border-top-color:#238b74;animation:ledger-wait .7s linear infinite}
@keyframes ledger-wait{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ledger-page-wait:before{animation:none}}
</style>
<script>
/* Acknowledge navigation after startup or while edited views are refreshing.
   No financial data is duplicated or stored; the original nav handler remains
   the only authority that renders a prepared page. */
(function(){
 const shell=document.querySelector('main.shell');
 const root=document.getElementById('planner-main');
 const splash=document.getElementById('planner-loading');
 let wanted=null,sequence=0,replaying=false;
 // The opening overlay is owned by the planner readiness signal, not by the
 // first DOM mutation. It stays visible until all destinations are prepared.
 document.addEventListener('click',function(event){
  const button=event.target.closest?.('[data-view]');
  if(!button||replaying)return;
  const ready=window.HouseholdAllViewsReady?.()===true;
  const cached=window.HouseholdPreparedViewStatus?.()?.includes(button.dataset.view);
  if(ready&&cached){
   // Cancel an older uncached destination so a rapid subsequent tap wins.
   sequence++;wanted=null;
   root.querySelector('.ledger-page-wait')?.remove();
   root.removeAttribute('aria-busy');
   return;
  }
  // Until the existing warmup finishes, keep the tab interactive and visible.
  event.preventDefault();event.stopImmediatePropagation();
  const view=button.dataset.view,id=++sequence;
  wanted={view,button};
  document.querySelectorAll('[data-view]').forEach(tab=>{
   const selected=tab.dataset.view===view;
   tab.classList.toggle('active',selected);
   if(selected)tab.setAttribute('aria-current','page');
   else tab.removeAttribute('aria-current');
  });
  root.querySelector('.ledger-page-wait')?.remove();
  const placeholder=document.createElement('div');
  placeholder.className='ledger-page-wait';
  placeholder.setAttribute('role','status');
  placeholder.textContent='Loading '+(button.textContent.trim()||'page')+'…';
  root.appendChild(placeholder);
  root.setAttribute('aria-busy','true');
  if(shell){shell.inert=false;shell.removeAttribute('aria-busy')}
  if(splash&&window.HouseholdAllViewsReady?.())splash.style.display='none';
  const replay=()=>{
   if(id!==sequence||!wanted)return;
   if(window.HouseholdAllViewsReady?.()){
    wanted=null;
    // Keep the in-page loading surface visible through the synchronous
    // destination build. Render/DOM swap removes it only after the new page
    // is ready, rather than exposing a frozen previous page.
    replaying=true;
    try{button.click()}finally{
     replaying=false;
     if(placeholder.isConnected)placeholder.remove();
     root.removeAttribute('aria-busy');
    }
   }else setTimeout(replay,35);
  };
  // A task immediately after a paint frame lets Safari/Chromium paint the
  // newly selected tab and spinner BEFORE any expensive Activity markup.
  if(typeof requestAnimationFrame==='function'&&document.visibilityState!=='hidden')
   requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(replay,0)));
  else setTimeout(replay,35);
 },true);
})();
</script>
