(()=>{
'use strict';const KEY='household-ledger-v1',CATS=['Groceries','Shopping','Housing','Utilities','Transportation','Dining','Health','Entertainment','Kids & Family','Insurance','Subscriptions','Other'],BANDS=[['Under $10',0,10],['$10–$25',10,25],['$25–$50',25,50],['$50–$100',50,100],['$100–$200',100,200],['$200–$500',200,500],['$500+',500,Infinity]],money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c])),el=x=>document.getElementById(x),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('en-CA');const initialStorage=localStorage.getItem(KEY);let data;try{data=JSON.parse(initialStorage);if(!data||!Array.isArray(data.transactions))throw Error()}catch{data={transactions:[],items:[],budgets:{}}}data.items??=[];data.budgets??={};if(initialStorage===null&&typeof window.createHouseholdLedgerDemo==='function'){data=window.createHouseholdLedgerDemo();save()}function hasDemo(){return data.transactions.some(t=>t.demo)}function loadDemo(){if(typeof window.createHouseholdLedgerDemo!=='function'){alertMsg('Demo data file could not be loaded.');return}const demo=window.createHouseholdLedgerDemo(),existing=new Set(data.transactions.map(t=>t.id)),fresh=demo.transactions.filter(t=>!existing.has(t.id));data.transactions.push(...fresh);const itemIds=new Set(data.items.map(x=>x.id));data.items.push(...demo.items.filter(x=>!itemIds.has(x.id)));for(const [key,value] of Object.entries(demo.budgets))if(!(key in data.budgets))data.budgets[key]=value;save();render();alertMsg('Fictional sample data added.')}function removeDemo(){const n=data.transactions.filter(x=>x.demo).length;if(!n)return;if(!confirm('Remove '+n+' fictional sample transactions and their linked items? Your own transactions will remain.'))return;const demoIds=new Set(data.transactions.filter(x=>x.demo).map(x=>x.id));data.transactions=data.transactions.filter(x=>!x.demo);data.items=data.items.filter(x=>!x.demo&&!demoIds.has(x.transactionId));save();render();alertMsg('Sample transactions removed.')}let page='overview',period='all';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function alertMsg(s){el('flash').innerHTML='<div class="message">'+esc(s)+'</div>';setTimeout(()=>el('flash').innerHTML='',5000)}function cleanMerchant(s){let u=s.toUpperCase();if(u.includes('COSTCO'))return /GAS|FUEL|PUMP/.test(u)?'Costco Gas':'Costco Warehouse';if(/AMAZON|AMZN/.test(u))return 'Amazon';if(u.includes('WALMART')||u.includes('WAL-MART'))return 'Walmart';if(u.includes('SAFEWAY'))return 'Safeway';return s.trim()}function type(s,n){if(/TRANSFER|PAYMENT TO|CARD PAYMENT|AUTOPAY|CREDIT CARD PAYMENT/i.test(s))return 'transfer';if(/PAYROLL|DIRECT DEPOSIT|REFUND|DEPOSIT/i.test(s))return 'income';return n>0?'income':'expense'}function category(s){s=s.toLowerCase();if(/costco gas|shell|chevron|fuel|exxon/.test(s))return'Transportation';if(/costco|safeway|grocery|trader joe|kroger/.test(s))return'Groceries';if(/amazon|walmart|target|ebay|home depot/.test(s))return'Shopping';if(/mortgage|rent/.test(s))return'Housing';if(/water|electric|internet|utility|xfinity|verizon/.test(s))return'Utilities';if(/restaurant|coffee|pizza|cafe/.test(s))return'Dining';return'Other'}function rows(){return data.transactions.filter(t=>period==='all'||t.date.slice(0,7)===period)}function expense(){return rows().filter(t=>t.type==='expense')}function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}function grouped(a,field){const o={};a.forEach(t=>{const k=field==='merchant'?cleanMerchant(t.merchant):t.category;o[k]??={name:k,amount:0,count:0};o[k].amount+=+t.amount;o[k].count++});return Object.values(o).sort((a,b)=>b.amount-a.amount)}function gridStats(){let a=expense(),income=sum(rows().filter(x=>x.type==='income'));let count=a.reduce((n,t)=>n+(data.items.filter(i=>i.transactionId===t.id).length||1),0);return'<div class="stats">'+[['Total spending',money(sum(a)),'Transfers excluded'],['Income',money(income),'Deposits and paychecks'],['Net cash flow',money(income-sum(a)),'Income minus spending'],['Purchases / items',count,'Item-level where available']].map(x=>'<div class="stat"><div class="sub">'+x[0]+'</div><div class="num">'+x[1]+'</div><div class="sub">'+x[2]+'</div></div>').join('')+'</div>'}function list(a,max=999){const top=Math.max(1,...a.map(x=>x.amount));return a.slice(0,max).map(x=>'<div class="row"><div style="flex:1"><b>'+esc(x.name)+'</b><div class="bar"><i style="width:'+(x.amount/top*100).toFixed(1)+'%"></i></div></div><div><strong>'+money(x.amount)+'</strong><div class="sub">'+(x.count||'')+' purchases</div></div></div>').join('')||'<div class="empty">No data yet. Import a bank CSV or add a transaction.</div>'}function table(a){return'<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>'+a.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.merchant)+'</td><td>'+esc(t.category)+'</td><td>'+esc(t.type)+'</td><td><strong>'+money(t.amount)+'</strong></td><td><button class="btn" data-edit="'+esc(t.id)+'">Edit</button></td></tr>').join('')+'</tbody></table></div>'}function render(){const demoCount=data.transactions.filter(t=>t.demo).length;el('demo-banner').innerHTML=demoCount?'<div class="demo-banner"><strong>DEMO MODE — '+demoCount+' fictional transactions</strong><span>Not real household spending.</span><button id="remove-demo-banner">Remove demo data</button></div>':'';if(demoCount)el('remove-demo-banner').onclick=removeDemo;const title=page.charAt(0).toUpperCase()+page.slice(1);el('title').textContent=title;el('section').textContent=title;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let months=[...new Set(data.transactions.map(t=>t.date.slice(0,7)))].sort().reverse();if(period!=='all'&&!months.includes(period))period='all';el('period').innerHTML='<option value="all">All dates</option>'+months.map(m=>'<option value="'+m+'" '+(period===m?'selected':'')+'>'+m+'</option>').join('');let a=expense(),html='';if(page==='overview')html=gridStats()+'<div class="grid"><div class="panel"><h3>Spending by category</h3>'+list(grouped(a,'category'),8)+'</div><div class="panel"><h3>Top merchants</h3>'+list(grouped(a,'merchant'),8)+'</div></div><div class="panel"><h3>Recent transactions</h3>'+table(rows().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12))+'</div>';if(page==='transactions')html='<div class="panel"><h3>Transactions · '+rows().length+' entries</h3>'+table(rows().sort((a,b)=>b.date.localeCompare(a.date)))+'</div>';if(page==='merchants')html=gridStats()+'<div class="panel"><h3>Merchant totals</h3>'+list(grouped(a,'merchant'))+'</div>';if(page==='insights'){let counts=BANDS.map(([name,min,max])=>({name,count:0,amount:0}));a.forEach(t=>{let items=data.items.filter(i=>i.transactionId===t.id),p=items.length?items:[t];p.forEach(v=>{let j=BANDS.findIndex(([,lo,hi])=>+v.amount>=lo&&+v.amount<hi);if(j>=0){counts[j].count++;counts[j].amount+=+v.amount}})});html=gridStats()+'<div class="grid"><div class="panel"><h3>Individual purchase price bands</h3>'+counts.map(x=>'<div class="row"><span>'+x.name+'</span><div style="text-align:right"><strong>'+money(x.amount)+'</strong><div class="sub">'+x.count+' items</div></div></div>').join('')+'</div><div class="panel"><h3>Category breakdown</h3>'+list(grouped(a,'category'))+'</div></div><p class="sub">Linked items replace their parent transaction for item-size counts; they are never double-counted in household spending.</p>'}if(page==='budgets'){let cats=[...new Set([...CATS,...Object.keys(data.budgets)])];html='<div class="panel"><h3>Monthly category budgets</h3><p class="sub">Budgets apply to the selected month or, when viewing all dates, to the current month.</p>'+cats.map(c=>{const m=period==='all'?today().slice(0,7):period,spent=sum(data.transactions.filter(t=>t.type==='expense'&&t.category===c&&t.date.startsWith(m))),limit=+data.budgets[c]||0;return'<div class="row"><div style="flex:1"><strong>'+esc(c)+'</strong><div class="sub">'+money(spent)+' of '+(limit?money(limit):'No limit')+'</div><div class="bar"><i style="width:'+Math.min(100,limit?spent/limit*100:0)+'%"></i></div></div><button class="btn" data-budget="'+esc(c)+'">Set budget</button></div>'}).join('')+'</div>'}if(page==='settings')html='<div class="panel"><h3>Data and privacy</h3><p>Transactions are saved only in this browser. They do not synchronize across devices or connect directly to a bank.</p><p>Export regular backups. The file contains your financial records in plaintext.</p><div class="toolbar"><button class="btn primary" id="load-demo">Load sample data</button><button class="btn danger" id="remove-demo">Remove sample data</button></div><button class="btn primary" id="backup">Export JSON backup</button> <label class="btn">Restore JSON backup <input id="restore" type="file" accept=".json" class="hide"></label></div>';el('view').innerHTML=html;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(data.transactions.find(t=>t.id===b.dataset.edit)));document.querySelectorAll('[data-budget]').forEach(b=>b.onclick=()=>{let c=b.dataset.budget,n=prompt('Monthly budget for '+c+' ($)',data.budgets[c]||'');if(n!==null&&Number.isFinite(+n)&&+n>=0){data.budgets[c]=+n;save();render()}});if(page==='settings'){el('load-demo').onclick=loadDemo;el('remove-demo').onclick=removeDemo;el('backup').onclick=()=>download(JSON.stringify(data,null,2),'household-ledger-backup.json','application/json');el('restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.transactions)||!Array.isArray(v.items))throw Error();if(!confirm('Replace all current data with this backup?'))return;data=v;save();render();alertMsg('Backup restored')}catch{alertMsg('Invalid backup')}}}}function download(s,name,mime){let u=URL.createObjectURL(new Blob([s],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function form(t){let edit=!!t;t??={date:today(),merchant:'',amount:'',type:'expense',category:'Other',account:'',description:''};el('flash').innerHTML='<div class="panel"><h3>'+(edit?'Edit':'Add')+' transaction</h3><form id="entry"><div class="formgrid"><label>Date<input name="date" type="date" required value="'+esc(t.date)+'"></label><label>Amount ($)<input name="amount" type="number" step=".01" min=".01" required value="'+esc(t.amount)+'"></label><label>Merchant<input name="merchant" required value="'+esc(t.merchant)+'"></label><label>Type<select name="type">'+['expense','income','transfer'].map(x=>'<option '+(t.type===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Category<select name="category">'+CATS.map(x=>'<option '+(t.category===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Account<input name="account" value="'+esc(t.account||'')+'"></label></div><div class="toolbar"><button type="submit" class="btn primary">Save entry</button><button type="button" class="btn" id="cancel">Cancel</button>'+(edit?'<button type="button" class="btn danger" id="delete">Delete</button>':'')+'</div></form></div>';el('entry').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={...t,id:t.id||id(),date:f.get('date'),merchant:cleanMerchant(f.get('merchant')),amount:+f.get('amount'),type:f.get('type'),category:f.get('category'),account:f.get('account')};if(edit)data.transactions=data.transactions.map(x=>x.id===t.id?v:x);else data.transactions.push(v);save();render();alertMsg('Entry saved')};el('cancel').onclick=()=>el('flash').innerHTML='';if(edit)el('delete').onclick=()=>{if(confirm('Delete this entry?')){data.transactions=data.transactions.filter(x=>x.id!==t.id);data.items=data.items.filter(x=>x.transactionId!==t.id);save();render()}};scrollTo({top:0,behavior:'smooth'})}function csvParse(s){let arr=[],row=[],field='',quote=false;s=s.replace(/^\uFEFF/,'');for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){field+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(Boolean))arr.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(Boolean))arr.push(row);return arr}function parseDate(s){s=String(s||'').trim();if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(0,10);let m=s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/);if(!m)return'';let y=+m[3];if(y<100)y+=2000;return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')}el('csv').onchange=async e=>{let f=e.target.files[0];if(!f)return;let csv=csvParse(await f.text());let heads=(csv.shift()||[]).map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'')),ix=(...names)=>heads.findIndex(h=>names.some(n=>h.includes(n))),d=ix('date'),a=ix('amount'),db=ix('debit','withdrawal'),cr=ix('credit','deposit'),desc=ix('description','memo','details','name'),me=ix('merchant','payee'),acc=ix('account');if(d<0||(a<0&&db<0&&cr<0)){alertMsg('CSV needs Date and Amount (or Debit/Credit) columns.');return}let positive=confirm('Does this statement show expenses as POSITIVE amounts? Choose OK for yes, Cancel for no.');let added=0;for(let row of csv){let date=parseDate(row[d]);if(!date)continue;let description=String(row[desc]||row[me]||'Unknown').trim(),merchant=cleanMerchant(String(row[me]||description)),num=x=>{let v=String(x||'').replace(/[$,\s]/g,'');return /^\(.*\)$/.test(v)?-Number(v.replace(/[()]/g,'')):Number(v)},raw;if(db>=0||cr>=0){let debit=num(row[db]),credit=num(row[cr]);raw=debit?-Math.abs(debit):Math.abs(credit)}else{raw=num(row[a]);if(positive)raw=-raw}if(!Number.isFinite(raw)||!raw)continue;let v={id:id(),date,merchant,description,amount:Math.abs(raw),type:type(description,raw),category:category(merchant),account:acc>=0?row[acc]:''};if(v.type==='expense'&&raw>0&&positive)v.type='expense';if(!data.transactions.some(t=>t.date===v.date&&t.merchant===v.merchant&&t.amount===v.amount&&t.account===v.account&&t.type===v.type)){data.transactions.push(v);added++}}save();render();alertMsg('Imported '+added+' new transactions. Review transfers and categories.');e.target.value=''};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});el('period').onchange=e=>{period=e.target.value;render()};el('addBtn').onclick=()=>form();el('importBtn').onclick=()=>el('csv').click();render()})();
